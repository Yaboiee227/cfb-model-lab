name: NFL turnover regression validation (development only)

on:
  push:
    branches: [nfl-model-development]
    paths:
      - 'scripts/validate_nfl_turnover_regression_v1.py'
      - 'nfl_data/historical/team_week_turnover_regression_2022_2025.csv'
      - '.github/workflows/nfl-turnover-regression-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-turnover-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated NFL development branch
        uses: actions/checkout@v4
        with:
          ref: nfl-model-development
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy
      - name: Validate turnover and regression candidates
        run: python scripts/validate_nfl_turnover_regression_v1.py
      - name: Commit validation artifacts safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl_data/validation/turnover_regression_v1_predictions.csv nfl_data/validation/turnover_regression_v1_coefficients.csv nfl_data/validation/turnover_regression_v1_qa.json
          if git diff --cached --quiet; then
            echo "No turnover regression validation changes to commit"
          else
            git commit -m "Validate NFL turnover regression candidates"
            git pull --rebase origin nfl-model-development
            git push origin nfl-model-development
          fi

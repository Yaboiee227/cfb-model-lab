name: CFB automated record tracker
on:
  push:
    paths:
      - 'scripts/record_tracker*.py'
      - 'scripts/projection_locking.py'
      - 'scripts/lock_projections_v2.py'
      - 'scripts/validate_benchmarks.py'
      - 'tests/**'
      - 'cfb/benchmarks/**'
      - '.github/workflows/cfb-record-tracker.yml'
  workflow_dispatch:
    inputs:
      week:
        description: Week number or latest
        required: false
        default: latest
      dry_run:
        description: Dry run (no commit)
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '17 15 * * 0'
    - cron: '17 21 * * 0'
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: cfb-record-tracker
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Test grading and lock rules
        run: python -m unittest discover -s tests -v
      - name: Validate latest CFB benchmark snapshot
        run: |
          latest=$(ls cfb/benchmarks/week-*.json 2>/dev/null | sort | tail -n 1 || true)
          if [ -n "$latest" ]; then python scripts/validate_benchmarks.py "$latest"; else echo 'No CFB benchmark snapshot yet.'; fi
      - name: Detect locked weekly files
        id: data
        run: |
          if compgen -G 'cfb/projections/week-*.json' > /dev/null; then echo 'ready=true' >> "$GITHUB_OUTPUT"; else echo 'ready=false' >> "$GITHUB_OUTPUT"; fi
      - name: Integrity-only push check
        if: github.event_name == 'push'
        run: echo 'Push event runs tests and benchmark validation only; no grading or publishing mutation.'
      - name: No-op until first locked weekly JSON exists
        if: github.event_name != 'push' && steps.data.outputs.ready != 'true'
        run: echo 'No CFB week-XX.json projection file yet; preserving the current published record.'
      - name: Grade CFB
        if: github.event_name != 'push' && steps.data.outputs.ready == 'true'
        env:
          WEEK: ${{ github.event.inputs.week || 'latest' }}
          DRY: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ "$DRY" = "true" ]; then python scripts/record_tracker_v2.py --league cfb --week "$WEEK" --dry-run; else python scripts/record_tracker_v2.py --league cfb --week "$WEEK"; fi
      - name: Commit updated record files
        if: ${{ success() && github.event_name != 'push' && steps.data.outputs.ready == 'true' && github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "cb-model-record-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main
          git add cfb/results cfb/record-summary.json cfb/grading-log.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-grade CFB projection record"
            git push
          fi
      - name: Deploy refreshed Pages data
        if: ${{ success() && github.event_name != 'push' && steps.data.outputs.ready == 'true' && github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `CFB record tracker failed: ${new Date().toISOString().slice(0,10)}`;
            const body = `The automated CFB grading/integrity workflow failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThe previous published record remains the source of truth.`;
            const existing = await github.rest.issues.listForRepo({owner:context.repo.owner,repo:context.repo.repo,state:'open',labels:'record-tracker'}).catch(()=>({data:[]}));
            if (!existing.data.some(i=>i.title===title)) await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body,labels:['record-tracker']}).catch(async()=>github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body}));

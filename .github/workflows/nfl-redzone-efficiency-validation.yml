name: NFL Red Zone Efficiency Validation

on:
  workflow_dispatch:
  push:
    branches: [nfl-model-development]
    paths:
      - 'scripts/build_nfl_historical_redzone_features.py'
      - 'scripts/validate_nfl_redzone_efficiency.py'
      - '.github/workflows/nfl-redzone-efficiency-validation.yml'

permissions:
  contents: write

concurrency:
  group: nfl-redzone-efficiency-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/nfl-model-development'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated NFL development branch
        uses: actions/checkout@v4
        with:
          ref: nfl-model-development
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy pandas pyarrow
      - name: Build leakage-safe red-zone snapshots
        run: python scripts/build_nfl_historical_redzone_features.py
      - name: Validate red-zone incremental value
        run: python scripts/validate_nfl_redzone_efficiency.py
      - name: Enforce research-only guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('nfl_data/generated/redzone_build_qa_2026_week6.json').read_text())
          d=json.loads(Path('nfl_data/validation/redzone_efficiency_robustness.json').read_text())
          assert q['historical_leakage_rows'] == 0
          assert q['current_target_or_future_rows_used'] == 0
          assert d['production_promotion_allowed'] is False
          assert d['website_publish_allowed'] is False
          assert d['recommendation_release_allowed'] is False
          assert d['week6_frozen_snapshot_may_be_rewritten'] is False
          print('red-zone research guard passed:', d['release_state'])
          PY
      - name: Verify live CFB site untouched
        run: |
          if git status --porcelain -- index.html app.js script.js styles.css data/projections.csv data/results.csv | grep .; then
            echo 'Live CFB website path changed unexpectedly'
            exit 1
          fi
          echo 'Live CFB website guard passed'
      - name: Commit red-zone artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nfl_data/historical/team_week_redzone_2022_2025.csv nfl_data/generated/redzone_2026_week6_pregame.csv nfl_data/generated/redzone_build_qa_2026_week6.json nfl_data/validation/redzone_efficiency_robustness.json
          if git diff --cached --quiet; then
            echo 'No red-zone artifacts to commit'
          else
            git commit -m 'Validate NFL red-zone efficiency layer'
            git pull --rebase origin nfl-model-development
            git push origin nfl-model-development
          fi

name: Refresh sportsbook markets

on:
  push:
    paths:
      - '.github/workflows/refresh-sportsbook-markets.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: market-snapshot-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Adaptive free-tier FanDuel / DraftKings refresh
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/markets-sportsbooks.json';
          const now = Date.now();
          const nowIso = new Date(now).toISOString();
          const manual = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch';
          const RESERVE_CREDITS = 30;
          const BOOKS = ['fanduel','draftkings'];

          const norm = value => String(value || '').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
          const same = (a,b) => norm(a) === norm(b) || norm(a).includes(norm(b)) || norm(b).includes(norm(a));
          const finite = value => Number.isFinite(Number(value));
          const numHeader = (headers, name) => {
            const raw = headers.get(name);
            return raw === null || raw === '' || !finite(raw) ? null : Number(raw);
          };
          const minutesSince = value => {
            const t = new Date(value || 0).getTime();
            return Number.isFinite(t) ? (now - t) / 60000 : Infinity;
          };
          const round5 = value => Math.max(5, Math.ceil(value / 5) * 5);

          async function publicJson(url) {
            const r = await fetch(url, { headers: { Accept:'application/json' } });
            if (!r.ok) throw new Error(`${r.status} ${r.statusText}: public data request failed`);
            return r.json();
          }

          async function oddsRequest(markets, commenceTimeFrom, commenceTimeTo) {
            const params = new URLSearchParams({
              apiKey: process.env.ODDS_API_KEY,
              bookmakers: BOOKS.join(','),
              markets: markets.join(','),
              commenceTimeFrom,
              commenceTimeTo,
              oddsFormat: 'american',
              dateFormat: 'iso'
            });
            const r = await fetch(`https://api.the-odds-api.com/v4/sports/americanfootball_ncaaf/odds?${params}`, {
              headers: { Accept:'application/json' }
            });
            if (!r.ok) throw new Error(`The Odds API returned ${r.status} ${r.statusText}`);
            const data = await r.json();
            return {
              data,
              quota: {
                remaining: numHeader(r.headers,'x-requests-remaining'),
                used: numHeader(r.headers,'x-requests-used'),
                lastCost: numHeader(r.headers,'x-requests-last')
              }
            };
          }

          function readExisting() {
            try { return JSON.parse(fs.readFileSync(path,'utf8')); }
            catch {
              return {
                generatedAt:null,
                provider:'The Odds API',
                books:BOOKS,
                games:[],
                quota:{remaining:null,used:null,lastCost:null}
              };
            }
          }

          function market(book, key) { return (book?.markets || []).find(m => m.key === key); }
          function outcome(mkt, name) { return mkt?.outcomes?.find(o => same(o.name,name)); }
          function totalOutcome(mkt, name) { return mkt?.outcomes?.find(o => String(o.name).toLowerCase() === name); }

          function parseCore(book, event) {
            if (!book) return null;
            const spread=market(book,'spreads'), total=market(book,'totals');
            if (!spread && !total) return null;
            const homeSp=outcome(spread,event.home_team), awaySp=outcome(spread,event.away_team);
            const over=totalOutcome(total,'over'), under=totalOutcome(total,'under');
            return {
              updatedAt: book.last_update || spread?.last_update || total?.last_update || nowIso,
              spread: {
                home: homeSp?.point ?? null,
                homePrice: homeSp?.price ?? null,
                away: awaySp?.point ?? null,
                awayPrice: awaySp?.price ?? null
              },
              total: {
                point: over?.point ?? under?.point ?? null,
                overPrice: over?.price ?? null,
                underPrice: under?.price ?? null
              }
            };
          }

          function parseMoneyline(book, event) {
            if (!book) return null;
            const h2h=market(book,'h2h');
            if (!h2h) return null;
            const home=outcome(h2h,event.home_team), away=outcome(h2h,event.away_team);
            return {
              updatedAt: book.last_update || h2h?.last_update || nowIso,
              moneyline: { home: home?.price ?? null, away: away?.price ?? null }
            };
          }

          const hasAny = obj => obj && Object.values(obj).some(value => value !== null && value !== undefined);
          function openingFrom(priorOpening, current) {
            const old = priorOpening || {};
            return {
              moneyline: hasAny(old.moneyline) ? old.moneyline : { ...current.moneyline },
              spread: hasAny(old.spread) ? old.spread : { home:current.spread.home, away:current.spread.away },
              total: old.total?.point !== null && old.total?.point !== undefined ? old.total : { point:current.total.point }
            };
          }
          function historyPoint(current) {
            return {
              ts: nowIso,
              spreadHome:current.spread.home,
              total:current.total.point,
              homeMl:current.moneyline.home,
              awayMl:current.moneyline.away
            };
          }
          function appendHistory(history, point) {
            const arr = Array.isArray(history) ? [...history] : [];
            const last = arr[arr.length-1];
            const sig = p => JSON.stringify([p?.spreadHome,p?.total,p?.homeMl,p?.awayMl]);
            if (!last || sig(last) !== sig(point)) arr.push(point);
            return arr.slice(-160);
          }
          function newestTimestamp(...values) {
            return values.filter(Boolean).sort((a,b) => new Date(b).getTime() - new Date(a).getTime())[0] || nowIso;
          }

          function phaseFromScope(scopeGames) {
            let nearestMinutes = Infinity;
            for (const game of scopeGames) {
              const t = new Date(game.kickoff).getTime();
              if (!Number.isFinite(t)) continue;
              const diff = (t - now) / 60000;
              if (diff >= 0 && diff < nearestMinutes) nearestMinutes = diff;
            }
            if (nearestMinutes <= 60) return { name:'kickoff-soon', nearestMinutes, core:20, moneyline:60 };
            if (nearestMinutes <= 180) return { name:'pregame-3h', nearestMinutes, core:45, moneyline:90 };
            if (nearestMinutes <= 360) return { name:'pregame-6h', nearestMinutes, core:90, moneyline:180 };
            return { name:'quiet', nearestMinutes, core:null, moneyline:null };
          }

          function quotaFactor(remaining) {
            if (!finite(remaining)) return 1;
            const r=Number(remaining);
            if (r <= 45) return 3;
            if (r <= 90) return 2;
            if (r <= 150) return 1.5;
            return 1;
          }

          function priorGame(old, event) {
            return (old.games || []).find(g => String(g.id) === String(event.id)) ||
              (old.games || []).find(g => same(g.homeTeam,event.home_team) && same(g.awayTeam,event.away_team));
          }

          function mergeGames(old, coreData, mlData) {
            const coreMap=new Map((coreData || []).map(e => [String(e.id),e]));
            const mlMap=new Map((mlData || []).map(e => [String(e.id),e]));
            const ids=new Set([...coreMap.keys(),...mlMap.keys(),...(old.games || []).map(g => String(g.id))]);
            const out=[];

            for (const id of ids) {
              const previous=priorGame(old,coreMap.get(id) || mlMap.get(id) || {id});
              const event=coreMap.get(id) || mlMap.get(id) || previous;
              const books={};

              for (const key of BOOKS) {
                const coreRaw=coreMap.get(id)?.bookmakers?.find(b => b.key === key);
                const mlRaw=mlMap.get(id)?.bookmakers?.find(b => b.key === key);
                const core=parseCore(coreRaw,event);
                const ml=parseMoneyline(mlRaw,event);
                const prior=previous?.books?.[key];
                if (!core && !ml && !prior) continue;

                const current={
                  updatedAt:newestTimestamp(core?.updatedAt,ml?.updatedAt,prior?.updatedAt),
                  moneyline:ml?.moneyline || prior?.moneyline || {home:null,away:null},
                  spread:core?.spread || prior?.spread || {home:null,homePrice:null,away:null,awayPrice:null},
                  total:core?.total || prior?.total || {point:null,overPrice:null,underPrice:null}
                };
                current.opening=openingFrom(prior?.opening,current);
                current.history=appendHistory(prior?.history,historyPoint(current));
                books[key]=current;
              }

              out.push({
                id:event.id,
                sportKey:event.sport_key || previous?.sportKey || 'americanfootball_ncaaf',
                commenceTime:event.commence_time || previous?.commenceTime || null,
                homeTeam:event.home_team || previous?.homeTeam || '',
                awayTeam:event.away_team || previous?.awayTeam || '',
                books
              });
            }
            return out;
          }

          (async () => {
            const old=readExisting();
            const scope=JSON.parse(fs.readFileSync('cfb/pregame/week-08-active-through-thursday.json','utf8'));
            const scopeGames=scope.games || [];
            const remainingScopeGames=scopeGames.filter(game => new Date(game.kickoff).getTime() > now);
            if (!remainingScopeGames.length) {
              console.log('No remaining pregame games in the active Tuesday-Thursday scope; no odds credits used.');
              return;
            }
            const phase=phaseFromScope(remainingScopeGames);
            const commenceTimeFrom=nowIso;
            const commenceTimeTo=remainingScopeGames.map(game => game.kickoff).sort().at(-1);
            const aliasData=JSON.parse(fs.readFileSync('data/team-aliases.json','utf8'));
            const aliasToCanonical=new Map();
            for (const [canonical,variants] of Object.entries(aliasData)) {
              aliasToCanonical.set(norm(canonical),norm(canonical));
              for (const variant of variants) aliasToCanonical.set(norm(variant),norm(canonical));
            }
            const canonicalTeam=value => aliasToCanonical.get(norm(value)) || norm(value);
            const sameTeam=(a,b) => canonicalTeam(a)===canonicalTeam(b) || same(a,b);
            const inActiveScope=event => scopeGames.some(game =>
              Math.abs(new Date(event.commence_time).getTime()-new Date(game.kickoff).getTime()) <= 5*60*1000 &&
              sameTeam(event.home_team,game.homeTeam) && sameTeam(event.away_team,game.awayTeam)
            );

            if (phase.name === 'quiet' && !manual) {
              console.log('No live game or kickoff within six hours; no odds credits used.');
              return;
            }
            if (!process.env.ODDS_API_KEY) {
              console.log('ODDS_API_KEY is not configured; leaving existing snapshot untouched.');
              return;
            }

            const factor=quotaFactor(old.quota?.remaining);
            const coreInterval=phase.core === null ? null : round5(phase.core * factor);
            const mlInterval=phase.moneyline === null ? null : round5(phase.moneyline * factor);
            const lastCore=old.lastCoreRefresh || old.generatedAt;
            const lastMl=old.lastMoneylineRefresh || old.generatedAt;
            let coreDue=manual || coreInterval === null || minutesSince(lastCore) >= coreInterval;
            let mlDue=manual || mlInterval === null || minutesSince(lastMl) >= mlInterval;

            const previousRemaining=finite(old.quota?.remaining) ? Number(old.quota.remaining) : null;
            if (!manual && previousRemaining !== null && previousRemaining <= RESERVE_CREDITS) {
              console.log(`Quota reserve reached (${previousRemaining} remaining); automatic refresh paused.`);
              return;
            }

            if (!coreDue && !mlDue) {
              console.log(`Refresh not due. Phase=${phase.name}; core every ${coreInterval}m; moneyline every ${mlInterval}m.`);
              return;
            }

            let available=previousRemaining === null ? Infinity : previousRemaining - RESERVE_CREDITS;
            if (!manual) {
              if (coreDue && available < 2) coreDue=false;
              if (coreDue) available-=2;
              if (mlDue && available < 1) mlDue=false;
            }
            if (!coreDue && !mlDue) {
              console.log('Refresh would cross the quota reserve floor; no odds credits used.');
              return;
            }

            let coreResp=null, mlResp=null, latestQuota=old.quota || {remaining:null,used:null,lastCost:null};
            let usageThisRun=0;

            if (coreDue) {
              coreResp=await oddsRequest(['spreads','totals'],commenceTimeFrom,commenceTimeTo);
              latestQuota=coreResp.quota;
              usageThisRun+=coreResp.quota.lastCost ?? 2;
              const scopedCore=coreResp.data.filter(inActiveScope);
              console.log(`Spread/total refresh: ${scopedCore.length} active-scope games; quota remaining ${coreResp.quota.remaining ?? 'unknown'}.`);
            }

            if (mlDue) {
              if (!manual && finite(latestQuota?.remaining) && Number(latestQuota.remaining) <= RESERVE_CREDITS) {
                console.log('Skipping moneyline refresh to preserve the reserve floor after spread/total update.');
                mlDue=false;
              } else {
                mlResp=await oddsRequest(['h2h'],commenceTimeFrom,commenceTimeTo);
                latestQuota=mlResp.quota;
                usageThisRun+=mlResp.quota.lastCost ?? 1;
                const scopedMoneylines=mlResp.data.filter(inActiveScope);
                console.log(`Moneyline refresh: ${scopedMoneylines.length} active-scope games; quota remaining ${mlResp.quota.remaining ?? 'unknown'}.`);
              }
            }

            const games=mergeGames(old,coreResp?.data.filter(inActiveScope),mlResp?.data.filter(inActiveScope));
            const output={
              generatedAt:nowIso,
              lastCoreRefresh:coreResp ? nowIso : (old.lastCoreRefresh || old.generatedAt || null),
              lastMoneylineRefresh:mlResp ? nowIso : (old.lastMoneylineRefresh || old.generatedAt || null),
              provider:'The Odds API',
              books:BOOKS,
              quota:{
                remaining:latestQuota?.remaining ?? old.quota?.remaining ?? null,
                used:latestQuota?.used ?? old.quota?.used ?? null,
                lastCost:latestQuota?.lastCost ?? null,
                usageThisRun,
                reserveCredits:RESERVE_CREDITS
              },
              refreshPolicy:{
                phase:phase.name,
                coreMarkets:['spreads','totals'],
                moneylineMarket:'h2h',
                coreIntervalMinutes:coreInterval,
                moneylineIntervalMinutes:mlInterval,
                quotaFactor:factor,
                manualOverride:manual
              },
              games,
              note:'Adaptive free-tier snapshot. Refresh timing and bookmaker updates are restricted to the active Tuesday-Thursday scope; out-of-scope prior rows remain unchanged. Spreads/totals refresh more often than moneylines; automatic calls slow as quota falls and stop at the reserve floor.'
            };
            fs.writeFileSync(path,JSON.stringify(output,null,2)+'\n');
            console.log(`Wrote ${games.length} NCAAF games using ${usageThisRun} credit${usageThisRun === 1 ? '' : 's'} this run.`);
          })().catch(err => { console.error(err.message || err); process.exit(1); });
          NODE

      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- data/markets-sportsbooks.json; then
            echo "No sportsbook snapshot change."
            exit 0
          fi
          git config user.name "cb-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/markets-sportsbooks.json
          git commit -m "Update sportsbook market snapshot [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

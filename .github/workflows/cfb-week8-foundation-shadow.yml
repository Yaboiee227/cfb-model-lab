name: CFB Week 8 foundation shadow
on:
  push:
    paths:
      - 'scripts/cfb_foundation_candidate.py'
      - 'tests/test_cfb_foundation_candidate.py'
      - 'cfb/validation/week-08-simple-foundation-validation.json'
      - 'cfb/pregame/week-08-tuesday-effective.json'
      - '.github/workflows/cfb-week8-foundation-shadow.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cfb-week8-foundation-shadow
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy
      - name: Test foundation candidate generator
        run: python -m unittest tests.test_cfb_foundation_candidate -v
      - name: Build Week 8 validated foundation shadow
        run: |
          python scripts/cfb_foundation_candidate.py \
            --state cfb/pregame/week-08-tuesday-effective.json \
            --validation cfb/validation/week-08-simple-foundation-validation.json \
            --as-of '2026-10-20T00:00:00-04:00' \
            --start '2026-08-20T00:00:00-04:00' \
            --output cfb/shadow/week-08-tuesday-foundation.json
      - name: Assert locked-parameter and no-leakage policy
        run: |
          python - <<'PY'
          import json
          p='cfb/shadow/week-08-tuesday-foundation.json'
          d=json.load(open(p))
          assert d['role']=='VALIDATED_FOUNDATION_PROSPECTIVE_SHADOW'
          assert d['canonicalInfluence'] is False
          assert d['canonicalPromotionAuthorized'] is False
          assert d['lockedParameters']=={'alpha':2.5,'halfLifeDays':56,'minTeamAppearances':4}, d['lockedParameters']
          assert d['parameterSelection']['developmentSeason']==2024
          assert d['parameterSelection']['holdoutSeason']==2025
          assert d['parameterSelection']['confirmationSeason']==2026
          assert d['parameterSelection']['hyperparametersRetunedForWeek8'] is False
          assert d['source']['marketDataUsed'] is False
          assert d['source']['externalRatingsUsed'] is False
          assert d['source']['postKickoffDataUsed'] is False
          assert len(d['games'])==3
          assert all(g['status']=='FOUNDATION_SHADOW_READY' for g in d['games'])
          print(json.dumps({'modelId':d['modelId'],'parameters':d['lockedParameters'],'games':[{ 'gameId':g['gameId'],'spread':g['projectedSpreadHome'],'total':g['projectedTotal'],'homeWinProbability':g['homeWinProbability']} for g in d['games']]},indent=2))
          PY
      - name: Commit foundation shadow
        run: |
          git config user.name "cb-model-shadow-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cfb/shadow/week-08-tuesday-foundation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build validated Week 8 foundation shadow'
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main
          done
          git push

name: NFL static context build (development only)

on:
  push:
    branches: [nfl-model-development]
    paths:
      - 'scripts/build_nfl_static_context.py'
      - '.github/workflows/nfl-static-context-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-static-context:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated NFL development branch
        uses: actions/checkout@v4
        with:
          ref: nfl-model-development
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas
      - name: Build static travel and venue context
        run: python scripts/build_nfl_static_context.py
      - name: Commit static context artifacts safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl_data/historical/game_static_context_2022_2025.csv nfl_data/generated/static_context_2026_week6.csv nfl_data/generated/static_context_build_qa_2026_week6.json
          if git diff --cached --quiet; then
            echo "No static context changes to commit"
          else
            git commit -m "Build NFL static travel and venue context"
            git pull --rebase origin nfl-model-development
            git push origin nfl-model-development
          fi

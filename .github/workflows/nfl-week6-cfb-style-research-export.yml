name: NFL Week 6 CFB-Style Research Export

on:
  workflow_dispatch:
  push:
    branches: [nfl-model-development]
    paths:
      - 'scripts/build_nfl_week6_cfb_style_research_export.py'
      - '.github/workflows/nfl-week6-cfb-style-research-export.yml'

permissions:
  contents: write

concurrency:
  group: nfl-week6-cfb-style-research-export-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export:
    if: github.ref == 'refs/heads/nfl-model-development'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated NFL development branch
        uses: actions/checkout@v4
        with:
          ref: nfl-model-development
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build CFB-style research export
        run: python scripts/build_nfl_week6_cfb_style_research_export.py
      - name: Enforce research-only export policy
        run: |
          python - <<'PY'
          import glob, json
          files=sorted(glob.glob('nfl_data/research_exports/week6_cfb_style_research_export_*.json'))
          assert files
          d=json.load(open(files[-1]))
          stable=json.load(open('nfl_data/research_exports/week6_cfb_style_research_latest.json'))
          assert d['website_publish_allowed'] is False
          assert stable['created_at_utc'] == d['created_at_utc']
          assert d['release_policy']['recommendations_enabled'] is False
          assert d['release_policy']['validated_edge_threshold_exists'] is False
          assert d['release_policy']['alt_line_logic_enabled'] is False
          assert len(d['games']) == 13
          for r in d['games']:
              assert r['website_publish_allowed'] is False
              assert r['recommendation'] == 'HOLD_NO_VALIDATED_EDGE_THRESHOLD'
          print('CFB-style NFL research export guard passed:', d['latest_market_capture_at_utc'])
          PY
      - name: Verify live CFB site untouched
        run: |
          if git status --porcelain -- index.html app.js script.js styles.css data/projections.csv data/results.csv | grep .; then
            echo 'Live CFB website path changed unexpectedly'
            exit 1
          fi
          echo 'Live CFB website guard passed'
      - name: Commit research export
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nfl_data/research_exports/week6_cfb_style_research_export_*.json nfl_data/research_exports/week6_cfb_style_research_export_*.csv nfl_data/research_exports/week6_cfb_style_research_latest.json nfl_data/research_exports/week6_cfb_style_research_latest.csv
          if git diff --cached --quiet; then
            echo 'No CFB-style research export changes'
          else
            git commit -m 'Build CFB-style NFL Week 6 research export'
            git pull --rebase origin nfl-model-development
            git push origin nfl-model-development
          fi

name: Personnel challenger integrity
on:
  pull_request:
    paths:
      - 'scripts/personnel_scenarios.py'
      - 'scripts/validate_personnel_challenger.py'
      - 'tests/test_personnel_scenarios.py'
      - 'research/personnel/**'
      - '.github/workflows/personnel-challenger-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_personnel_scenarios.py -v
      - run: python scripts/personnel_scenarios.py research/personnel/synthetic-request.json --as-of 2026-10-01T12:00:00Z --output /tmp/personnel-example.json

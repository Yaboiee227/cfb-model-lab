name: NFL automated record tracker
on:
  workflow_dispatch:
    inputs:
      week:
        description: Week number or latest
        required: false
        default: latest
      dry_run:
        description: Dry run (no commit)
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '17 15 * * 2'
    - cron: '17 21 * * 2'
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: nfl-record-tracker
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Test grading rules
        run: python -m unittest discover -s tests -v
      - name: Detect locked weekly files
        id: data
        run: |
          if compgen -G 'nfl/projections/week-*.json' > /dev/null; then echo 'ready=true' >> "$GITHUB_OUTPUT"; else echo 'ready=false' >> "$GITHUB_OUTPUT"; fi
      - name: No-op until first locked weekly JSON exists
        if: steps.data.outputs.ready != 'true'
        run: echo 'No NFL week-XX.json projection file yet; preserving the current published record.'
      - name: Grade NFL
        if: steps.data.outputs.ready == 'true'
        env:
          WEEK: ${{ github.event.inputs.week || 'latest' }}
          DRY: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ "$DRY" = "true" ]; then python scripts/record_tracker.py --league nfl --week "$WEEK" --dry-run; else python scripts/record_tracker.py --league nfl --week "$WEEK"; fi
      - name: Commit updated record files
        if: ${{ success() && steps.data.outputs.ready == 'true' && github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "cb-model-record-bot"
          git config user.email "actions@users.noreply.github.com"
          git add nfl/results nfl/record-summary.json nfl/grading-log.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-grade NFL projection record"
            git push
          fi
      - name: Deploy refreshed Pages data
        if: ${{ success() && steps.data.outputs.ready == 'true' && github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `NFL record tracker failed: ${new Date().toISOString().slice(0,10)}`;
            const body = `The automated NFL grading workflow failed and did not publish a new record.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThe previous published record remains the source of truth.`;
            const existing = await github.rest.issues.listForRepo({owner:context.repo.owner,repo:context.repo.repo,state:'open',labels:'record-tracker'}).catch(()=>({data:[]}));
            if (!existing.data.some(i=>i.title===title)) await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body,labels:['record-tracker']}).catch(async()=>github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body}));

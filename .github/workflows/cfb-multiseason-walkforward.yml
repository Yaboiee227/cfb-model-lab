name: CFB multi-season walk-forward validation
on:
  push:
    paths:
      - 'scripts/cfb_multiseason_walkforward.py'
      - 'tests/test_cfb_multiseason_walkforward.py'
      - 'scripts/cfb_rich_challenger.py'
      - 'scripts/cfb_shadow_engine.py'
      - 'scripts/run_cfb_shadow_week8.py'
      - 'cfb/shadow/week-08-tuesday.json'
      - 'cfb/validation/week-07-canonical-reference.json'
      - '.github/workflows/cfb-multiseason-walkforward.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cfb-multiseason-walkforward
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy
      - name: Test season-reset validation
        run: python -m unittest tests.test_cfb_multiseason_walkforward -v
      - name: Run multi-season walk-forward
        run: |
          python scripts/cfb_multiseason_walkforward.py \
            --as-of '2026-10-20T00:00:00-04:00' \
            --shadow cfb/shadow/week-08-tuesday.json \
            --reference cfb/validation/week-07-canonical-reference.json \
            --output cfb/validation/week-08-multiseason-walkforward.json
      - name: Assert season reset and evidence policy
        run: |
          python - <<'PY'
          import json
          p='cfb/validation/week-08-multiseason-walkforward.json'
          d=json.load(open(p))
          assert d['role']=='MULTISEASON_SEASON_RESET_WALKFORWARD_RESEARCH'
          assert d['canonicalInfluence'] is False
          policy=d['policy']
          assert policy['priorSeasonTeamStateCarryover'] is False
          assert policy['marketDataUsed'] is False
          assert policy['externalRatingsUsed'] is False
          assert policy['sameWeekLeakagePrevented'] is True
          assert d['hfa']['for2025DerivedOnlyFrom']==[2022, 2023, 2024]
          wf=d['walkForward2026']
          assert len(wf['folds']) >= 3, wf['folds']
          assert wf['aggregate']['games'] >= 30, wf['aggregate']
          print(json.dumps({
              'folds': len(wf['folds']),
              'evidenceStatus': wf['evidenceStatus'],
              'aggregate': wf['aggregate'],
              'gatePass': wf['prospectiveShadowGatePass'],
              'dataQuality': d['dataQuality'],
          }, indent=2))
          PY
      - name: Commit multi-season evidence
        run: |
          git config user.name "cb-model-validation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cfb/validation/week-08-multiseason-walkforward.json
          if git diff --cached --quiet; then
            echo 'Multi-season evidence unchanged.'
            exit 0
          fi
          git commit -m 'Refresh CFB multi-season walk-forward evidence'
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main
          done
          git push

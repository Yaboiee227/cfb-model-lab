name: Refresh prediction markets

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: refresh-prediction-markets
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch public Kalshi and Polymarket snapshots
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='data/markets-prediction.json';
          const aliases=JSON.parse(fs.readFileSync('data/team-aliases.json','utf8')).aliases||{};
          const now=Date.now();
          const clean=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,'and').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();
          const aliasSet=name=>new Set([name,...(aliases[name]||[])].map(clean));
          const same=(a,b)=>{const A=aliasSet(a),B=aliasSet(b);for(const x of A)if(B.has(x))return true;const ca=clean(a),cb=clean(b);return ca===cb||ca.includes(cb)||cb.includes(ca)};
          const overlap=(text,name)=>[...aliasSet(name)].some(x=>x&&clean(text).includes(x));
          const j=async url=>{const r=await fetch(url,{headers:{Accept:'application/json','User-Agent':'CBModelProjections/1.0'}});if(!r.ok)throw new Error(`${r.status} ${url}`);return r.json()};
          const existing=(()=>{try{return JSON.parse(fs.readFileSync(path,'utf8'))}catch{return{games:[]}}})();
          const previousFor=(eventId,home,away)=>existing.games?.find(g=>String(g.eventId)===String(eventId)||(same(g.homeTeam,home)&&same(g.awayTeam,away)));
          const append=(prior,row)=>{if(!row?.matched||!Number.isFinite(Number(row.homeProbability)))return row;const history=Array.isArray(prior?.history)?[...prior.history]:[];const point={ts:row.updatedAt,home:Number(row.homeProbability)};if(!history.length||history[history.length-1].home!==point.home)history.push(point);return{...row,history:history.slice(-160)}};

          function kalshiFor(game,events){
            const candidates=[];
            for(const ev of events){const blob=`${ev.title||''} ${ev.sub_title||''}`;if(!(overlap(blob,game.home.name)&&overlap(blob,game.away.name)))continue;for(const m of ev.markets||[])candidates.push({...m,eventTitle:ev.title||''});}
            if(!candidates.length)return{matched:false,error:'No market listed / no reliable match'};
            let home=null,away=null,volume=0,liquidity=0;
            for(const m of candidates){const yes=`${m.yes_sub_title||''} ${m.title||''} ${m.subtitle||''}`,bid=Number(m.yes_bid_dollars),ask=Number(m.yes_ask_dollars),last=Number(m.last_price_dollars),p=Number.isFinite(bid)&&Number.isFinite(ask)?(bid+ask)/2:Number.isFinite(last)?last:null;if(p===null)continue;if(overlap(yes,game.home.name))home=p;if(overlap(yes,game.away.name))away=p;volume+=Number(m.volume_fp||m.volume||0)||0;liquidity+=Number(m.liquidity_dollars||m.liquidity||0)||0;}
            if(home===null&&away!==null)home=1-away;if(away===null&&home!==null)away=1-home;
            return home===null&&away===null?{matched:false,error:'No win-probability market matched'}:{matched:true,updatedAt:new Date().toISOString(),homeProbability:home,awayProbability:away,volume,liquidity};
          }
          const arr=v=>Array.isArray(v)?v:(()=>{try{return JSON.parse(v)}catch{return[]}})();
          function polymarketFor(game,markets){
            const candidates=(Array.isArray(markets)?markets:markets?.data||[]).filter(m=>{const blob=`${m.question||''} ${m.title||''} ${m.description||''} ${m.slug||''}`;return overlap(blob,game.home.name)&&overlap(blob,game.away.name)});
            let home=null,away=null,volume=0,liquidity=0;
            for(const m of candidates){const outcomes=arr(m.outcomes),prices=arr(m.outcomePrices).map(Number);outcomes.forEach((o,i)=>{if(overlap(o,game.home.name)&&Number.isFinite(prices[i]))home=prices[i];if(overlap(o,game.away.name)&&Number.isFinite(prices[i]))away=prices[i]});if(outcomes.length===2&&home===null&&away===null){const yi=outcomes.findIndex(o=>/^yes$/i.test(o));if(yi>=0&&Number.isFinite(prices[yi])){const q=`${m.question||''} ${m.title||''}`;if(overlap(q,game.home.name)){home=prices[yi];away=1-home}else if(overlap(q,game.away.name)){away=prices[yi];home=1-away}}}volume+=Number(m.volumeNum||m.volume||0)||0;liquidity+=Number(m.liquidityNum||m.liquidity||0)||0;}
            if(home===null&&away!==null)home=1-away;if(away===null&&home!==null)away=1-home;
            return home===null&&away===null?{matched:false,error:'No market listed / no reliable match'}:{matched:true,updatedAt:new Date().toISOString(),homeProbability:home,awayProbability:away,volume,liquidity};
          }

          (async()=>{
            const score=await j('https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?limit=200');
            const games=(score.events||[]).map(e=>{const c=e.competitions?.[0]||{},home=c.competitors?.find(x=>x.homeAway==='home')||{},away=c.competitors?.find(x=>x.homeAway==='away')||{};return{eventId:String(e.id),date:e.date,state:c.status?.type?.state||'pre',home:{name:home.team?.shortDisplayName||home.team?.displayName||''},away:{name:away.team?.shortDisplayName||away.team?.displayName||''}}}).filter(g=>{if(g.state==='in')return true;if(g.state!=='pre')return false;const t=new Date(g.date).getTime();return Number.isFinite(t)&&t-now>-30*60e3&&t-now<6*60*60e3});
            if(!games.length){console.log('No live/upcoming game window; skipping prediction-market requests.');return;}
            let kalshiEvents=[];try{const k=await j('https://external-api.kalshi.com/trade-api/v2/events?status=open&limit=200&with_nested_markets=true');kalshiEvents=k.events||[]}catch(e){console.warn('Kalshi unavailable:',e.message)}
            const out=[];
            for(const game of games){let poly=[];try{const q=encodeURIComponent(`${game.away.name} ${game.home.name}`);poly=await j(`https://gamma-api.polymarket.com/markets?closed=false&active=true&limit=100&q=${q}`)}catch(e){console.warn('Polymarket unavailable for',game.eventId,e.message)}const prior=previousFor(game.eventId,game.home.name,game.away.name);const kalshi=append(prior?.kalshi,kalshiFor(game,kalshiEvents));const polymarket=append(prior?.polymarket,polymarketFor(game,poly));out.push({eventId:game.eventId,date:game.date,homeTeam:game.home.name,awayTeam:game.away.name,kalshi,polymarket});}
            fs.writeFileSync(path,JSON.stringify({generatedAt:new Date().toISOString(),sources:['kalshi','polymarket'],games:out,note:'Public read-only API snapshots collected by GitHub Actions to avoid browser CORS dependencies.'},null,2)+'\n');
            console.log(`Wrote ${out.length} prediction-market game snapshots.`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- data/markets-prediction.json; then
            echo "No prediction-market snapshot change."
            exit 0
          fi
          git config user.name "cb-model-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/markets-prediction.json
          git commit -m "Update prediction market snapshot [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

name: NFL Week 6 readiness matrix (development only)

on:
  push:
    branches: [nfl-model-development]
    paths:
      - 'scripts/build_nfl_week6_readiness_matrix.py'
      - '.github/workflows/nfl-week6-readiness-matrix.yml'
      - 'nfl_data/prospective/week6_prelock_20261017T225656Z.json'
      - 'nfl_data/prospective/2026_week6_gate_inputs.json'
      - 'nfl_data/prospective/market_captures/week6_betmgm_web_capture_20261017T225910Z.json'
      - 'nfl_data/prospective/week6_qb_scenario_diagnostics.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-readiness-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated NFL development branch
        uses: actions/checkout@v4
        with:
          ref: nfl-model-development
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build readiness matrix
        run: python scripts/build_nfl_week6_readiness_matrix.py
      - name: Assert development-only release guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('nfl_data/prospective/week6_readiness_matrix_20261017.json')
          data = json.loads(p.read_text())
          assert data['website_publish_allowed'] is False
          assert data['summary']['recommendation_release_games'] == 0
          assert data['summary']['qb_operational_adjustment_games'] == 0
          assert all(r['website_publish_allowed'] is False for r in data['rows'])
          assert all(r['recommendation'].startswith('HOLD_') for r in data['rows'])
          print('Development-only readiness guard passed.')
          PY
      - name: Commit readiness artifacts safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl_data/prospective/week6_readiness_matrix_20261017.json nfl_data/prospective/week6_readiness_matrix_20261017.csv
          if git diff --cached --quiet; then
            echo "No readiness changes to commit"
          else
            git commit -m "Build NFL Week 6 readiness matrix"
            git pull --rebase origin nfl-model-development
            git push origin nfl-model-development
          fi
      - name: Verify no website publication paths changed
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -E '^(data/|app\.js$|index\.html$|.*\.css$|.*\.js$)' ; then
            echo "Unexpected website path changed" >&2
            exit 1
          fi

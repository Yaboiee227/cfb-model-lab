name: CFB market coverage pipeline

on:
  push:
    paths:
      - '.github/workflows/cfb-market-coverage-pipeline.yml'
      - 'scripts/publish_cfb_week8_website.py'
      - 'data/team-aliases.json'
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
  workflow_run:
    workflows: ['Refresh sportsbook markets']
    types: [completed]

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cfb-market-coverage-pipeline
  cancel-in-progress: false

jobs:
  refresh-sync-deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dispatch sportsbook refresh and wait for completion
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run refresh-sportsbook-markets.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
          sleep 3
          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow refresh-sportsbook-markets.yml \
            --event workflow_dispatch \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"
          test -n "$run_id"
          echo "Waiting for sportsbook refresh run $run_id"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Pull refreshed market snapshot
        run: git pull --rebase origin main

      - name: Decide whether publication sync is needed
        id: sync_check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          market = json.loads(Path('data/markets-sportsbooks.json').read_text(encoding='utf-8'))
          market_stamp = market.get('generatedAt')
          audit_path = Path('cfb/pregame/week-08-market-coverage-latest.json')
          prior_stamp = None
          if audit_path.exists():
              try:
                  prior_stamp = json.loads(audit_path.read_text(encoding='utf-8')).get('marketSnapshotGeneratedAt')
              except Exception:
                  pass
          event = os.environ.get('EVENT_NAME', '')
          current_week = int(json.loads(Path('data/config.json').read_text())['currentWeek'])
          needs = current_week == 8 and (event != 'workflow_run' or not market_stamp or market_stamp != prior_stamp)
          print(json.dumps({'event': event, 'marketSnapshotGeneratedAt': market_stamp, 'previousPublishedSnapshot': prior_stamp, 'needsSync': needs}, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fp:
              fp.write(f"needs_sync={'true' if needs else 'false'}\n")
          PY

      - name: Regenerate frozen Week 8 site board with current market context
        if: steps.sync_check.outputs.needs_sync == 'true'
        run: python scripts/publish_cfb_week8_website.py

      - name: Audit projection, market, and model-market gap coverage
        if: steps.sync_check.outputs.needs_sync == 'true'
        run: |
          python - <<'PY'
          import csv, json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          rows = list(csv.DictReader(open('data/projections.csv', encoding='utf-8')))
          markets = json.loads(Path('data/markets-sportsbooks.json').read_text(encoding='utf-8'))
          assert len(rows) == 56, f'expected 56 Week 8 rows, found {len(rows)}'
          model_missing = [r['gameId'] for r in rows if not r['modelSpreadHome'] or not r['modelTotal']]
          assert not model_missing, f'missing frozen model projections: {model_missing}'

          now = datetime.now(ZoneInfo('America/New_York'))
          future = []
          for r in rows:
            kickoff = datetime.strptime(f"{r['date']} {r['kickoffET']}", '%Y-%m-%d %I:%M %p').replace(tzinfo=ZoneInfo('America/New_York'))
            if kickoff > now:
              future.append(r)

          spread_rows = [r for r in rows if r['marketSpreadHome'] != '']
          total_rows = [r for r in rows if r['marketTotal'] != '']
          gap_rows = [r for r in rows if r['modelSpreadHome'] != '' and r['marketSpreadHome'] != '']
          future_spread = [r for r in future if r['marketSpreadHome'] != '']
          future_total = [r for r in future if r['marketTotal'] != '']
          future_gap = [r for r in future if r['modelSpreadHome'] != '' and r['marketSpreadHome'] != '']
          missing_future = [f"{r['awayTeam']} @ {r['homeTeam']}" for r in future if r['marketSpreadHome'] == '']

          report = {
            'checkedAt': now.isoformat(),
            'marketSnapshotGeneratedAt': markets.get('generatedAt'),
            'week8Rows': len(rows),
            'modelProjectionCoverage': f'{len(rows) - len(model_missing)}/{len(rows)}',
            'marketSpreadCoverageAllWeek': f'{len(spread_rows)}/{len(rows)}',
            'marketTotalCoverageAllWeek': f'{len(total_rows)}/{len(rows)}',
            'modelMarketGapCoverageAllWeek': f'{len(gap_rows)}/{len(rows)}',
            'remainingPregameGames': len(future),
            'remainingMarketSpreadCoverage': f'{len(future_spread)}/{len(future)}',
            'remainingMarketTotalCoverage': f'{len(future_total)}/{len(future)}',
            'remainingModelMarketGapCoverage': f'{len(future_gap)}/{len(future)}',
            'missingRemainingMarketSpreads': missing_future,
            'gapConvention': 'marketSpreadHome - modelSpreadHome; UI labels the side favored by the model relative to market',
            'canonicalProjectionChanges': 0
          }
          print(json.dumps(report, indent=2))
          Path('cfb/pregame/week-08-market-coverage-latest.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit synchronized site data and coverage audit
        if: steps.sync_check.outputs.needs_sync == 'true'
        id: commit
        run: |
          git config user.name "cb-model-market-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/projections.csv data/config.json cfb/pregame/week-08-market-coverage-latest.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Site market context already synchronized.'
            exit 0
          fi
          git commit -m 'Sync CFB Week 8 market coverage to site [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Pages
        if: steps.sync_check.outputs.needs_sync == 'true' && steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload synchronized Pages artifact
        if: steps.sync_check.outputs.needs_sync == 'true' && steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy synchronized CFB market board
        if: steps.sync_check.outputs.needs_sync == 'true' && steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4

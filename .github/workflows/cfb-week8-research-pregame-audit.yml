name: CFB Week 8 research pregame coverage audit
on:
  push:
    paths:
      - 'scripts/cfb_research_pregame_audit.py'
      - 'tests/test_cfb_research_pregame_audit.py'
      - 'cfb/pregame/week-08-schedule.json'
      - 'cfb/pregame/week-08-tuesday-effective.json'
      - 'cfb/pregame/week-08-wednesday-effective.json'
      - 'cfb/research-locks/week-08-foundation-full.json'
      - 'cfb/benchmarks/week-08-sagarin-full.json'
      - 'cfb/research-market-locks/week-08-foundation-market.json'
      - 'data/team-aliases.json'
      - '.github/workflows/cfb-week8-research-pregame-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
permissions:
  contents: write
concurrency:
  group: cfb-week8-research-pregame-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Sync current research state
        run: git pull --rebase origin main
      - name: Test full-week research audit
        run: python -m unittest tests.test_cfb_research_pregame_audit -v
      - name: Build current coverage audit
        run: |
          python scripts/cfb_research_pregame_audit.py \
            --schedule cfb/pregame/week-08-schedule.json \
            --foundation cfb/research-locks/week-08-foundation-full.json \
            --sagarin cfb/benchmarks/week-08-sagarin-full.json \
            --context cfb/pregame/week-08-tuesday-effective.json \
            --context cfb/pregame/week-08-wednesday-effective.json \
            --market-lock cfb/research-market-locks/week-08-foundation-market.json \
            --output cfb/pregame/week-08-research-coverage.json
      - name: Assert frozen research coverage and policy boundary
        run: |
          python - <<'PY'
          import json
          p='cfb/pregame/week-08-research-coverage.json'
          d=json.load(open(p))
          assert d['role']=='FULL_WEEK_RESEARCH_PREGAME_COVERAGE_AUDIT'
          assert d['canonicalInfluence'] is False
          assert d['canonicalPromotionAuthorized'] is False
          assert d['summary']['games']==56, d['summary']
          assert d['summary']['foundationLocked']==56, d['summary']
          assert d['summary']['sagarinCurrent']==56, d['summary']
          assert d['summary']['personnelCaptured'] >= 4, d['summary']
          assert d['summary']['weatherCaptured'] >= 4, d['summary']
          assert d['summary']['refereeCapturedOrExplicitlyChecked'] >= 4, d['summary']
          assert all(g['foundation']['status']=='LOCKED' for g in d['games'])
          assert all(g['benchmarks']['spPlus']=='PENDING_OFFICIAL_CAPTURE' for g in d['games'])
          wed=next(g for g in d['games'] if g.get('sourceGameId')=='401871070')
          assert wed['context']['contextSource']=='cfb/pregame/week-08-wednesday-effective.json', wed['context']
          assert wed['context']['personnel']!='NOT_CAPTURED', wed['context']
          assert wed['context']['weather']!='NOT_CAPTURED', wed['context']
          print(json.dumps({'summary':d['summary'],'wednesday':wed,'next':d['workQueue'][:10]},indent=2))
          PY
      - name: Commit changed operational audit
        run: |
          git config user.name "cb-model-pregame-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cfb/pregame/week-08-research-coverage.json
          if git diff --cached --quiet; then
            echo 'No durable pregame coverage changes.'
            exit 0
          fi
          git commit -m 'Refresh Week 8 research pregame coverage audit'
          git pull --rebase origin main
          git push

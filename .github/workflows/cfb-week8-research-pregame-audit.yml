name: CFB Week 8 research pregame coverage audit
on:
  push:
    paths:
      - 'scripts/cfb_research_pregame_audit.py'
      - 'tests/test_cfb_research_pregame_audit.py'
      - 'cfb/pregame/week-08-schedule.json'
      - 'cfb/pregame/week-08-schedule-through-thursday.json'
      - 'cfb/pregame/week-08-active-through-thursday.json'
      - 'cfb/pregame/week-08-tuesday-effective.json'
      - 'cfb/pregame/week-08-wednesday-effective.json'
      - 'cfb/pregame/week-08-thursday-effective.json'
      - 'cfb/research-locks/week-08-foundation-full.json'
      - 'cfb/benchmarks/week-08-sagarin-full.json'
      - 'cfb/research-market-locks/week-08-foundation-market.json'
      - 'data/team-aliases.json'
      - '.github/workflows/cfb-week8-research-pregame-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
permissions:
  contents: write
concurrency:
  group: cfb-week8-research-pregame-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Sync current research state
        run: git pull --rebase origin main
      - name: Test research audit engine
        run: python -m unittest tests.test_cfb_research_pregame_audit -v
      - name: Build active coverage audit through Thursday
        run: |
          python scripts/cfb_research_pregame_audit.py \
            --schedule cfb/pregame/week-08-schedule-through-thursday.json \
            --foundation cfb/research-locks/week-08-foundation-full.json \
            --sagarin cfb/benchmarks/week-08-sagarin-full.json \
            --context cfb/pregame/week-08-tuesday-effective.json \
            --context cfb/pregame/week-08-wednesday-effective.json \
            --context cfb/pregame/week-08-thursday-effective.json \
            --market-lock cfb/research-market-locks/week-08-foundation-market.json \
            --output cfb/pregame/week-08-research-coverage-through-thursday.json
          python - <<'PY'
          import json
          p='cfb/pregame/week-08-research-coverage-through-thursday.json'
          d=json.load(open(p))
          d['role']='ACTIVE_WINDOW_RESEARCH_PREGAME_COVERAGE_AUDIT'
          d['activeScope']='cfb/pregame/week-08-active-through-thursday.json'
          d['pauseBeforeGameDateET']='2026-10-23'
          d['policy']=(d.get('policy','') + ' Active operational scope is Tuesday through Thursday only; Friday and Saturday are paused until explicit resumption.').strip()
          with open(p,'w') as f:
              json.dump(d,f,indent=2)
              f.write('\n')
          PY
      - name: Assert frozen research coverage and Thursday pause boundary
        run: |
          python - <<'PY'
          import json
          p='cfb/pregame/week-08-research-coverage-through-thursday.json'
          d=json.load(open(p))
          assert d['role']=='ACTIVE_WINDOW_RESEARCH_PREGAME_COVERAGE_AUDIT'
          assert d['canonicalInfluence'] is False
          assert d['canonicalPromotionAuthorized'] is False
          assert d['activeScope']=='cfb/pregame/week-08-active-through-thursday.json'
          assert d['pauseBeforeGameDateET']=='2026-10-23'
          assert d['summary']['games']==7, d['summary']
          assert d['summary']['foundationLocked']==7, d['summary']
          assert d['summary']['sagarinCurrent']==7, d['summary']
          assert d['summary']['personnelCaptured']==7, d['summary']
          assert d['summary']['weatherCaptured']==7, d['summary']
          assert d['summary']['refereeCapturedOrExplicitlyChecked']==7, d['summary']
          assert all(g['foundation']['status']=='LOCKED' for g in d['games'])
          assert all(g['benchmarks']['spPlus']=='PENDING_OFFICIAL_CAPTURE' for g in d['games'])
          assert all(g['kickoff'] < '2026-10-23T04:00:00Z' for g in d['games'])
          expected={
              '401871055':'cfb/pregame/week-08-tuesday-effective.json',
              '401871069':'cfb/pregame/week-08-tuesday-effective.json',
              '401871092':'cfb/pregame/week-08-tuesday-effective.json',
              '401871070':'cfb/pregame/week-08-wednesday-effective.json',
              '401869845':'cfb/pregame/week-08-thursday-effective.json',
              '401871056':'cfb/pregame/week-08-thursday-effective.json',
              '401862807':'cfb/pregame/week-08-thursday-effective.json',
          }
          assert {g.get('sourceGameId') for g in d['games']}==set(expected)
          for source_id, source_path in expected.items():
              game=next(g for g in d['games'] if g.get('sourceGameId')==source_id)
              assert game['context']['contextSource']==source_path, game['context']
              assert game['context']['personnel']!='NOT_CAPTURED', game['context']
              assert game['context']['weather']!='NOT_CAPTURED', game['context']
          print(json.dumps({'summary':d['summary'],'next':d['workQueue'][:10]},indent=2))
          PY
      - name: Commit changed active-window operational audit
        run: |
          git config user.name "cb-model-pregame-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cfb/pregame/week-08-research-coverage-through-thursday.json
          if git diff --cached --quiet; then
            echo 'No durable active-window pregame coverage changes.'
            exit 0
          fi
          git commit -m 'Refresh Week 8 through-Thursday pregame coverage audit'
          git pull --rebase origin main
          git push

name: NFL trench feature build (development only)

on:
  push:
    branches: [nfl-model-development]
    paths:
      - 'scripts/build_nfl_trench_features.py'
      - '.github/workflows/nfl-trench-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-trench-features:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated NFL development branch
        uses: actions/checkout@v4
        with:
          ref: nfl-model-development
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas pyarrow
      - name: Build leakage-safe trench features
        run: python scripts/build_nfl_trench_features.py
      - name: Commit trench research artifacts safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl_data/historical/team_week_trench_2022_2025.csv nfl_data/generated/trench_2026_week6_pregame.csv nfl_data/generated/trench_build_qa_2026_week6.json
          if git diff --cached --quiet; then
            echo "No trench changes to commit"
          else
            git commit -m "Build leakage-safe NFL trench features"
            git push origin nfl-model-development
          fi

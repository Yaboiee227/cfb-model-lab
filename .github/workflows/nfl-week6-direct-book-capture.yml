name: NFL Week 6 direct-book capture (development only)

on:
  push:
    branches: [nfl-model-development]
    paths:
      - 'scripts/build_nfl_week6_direct_book_capture.py'
      - 'nfl_data/prospective/2026_week6_direct_book_capture_input.json'
      - '.github/workflows/nfl-week6-direct-book-capture.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-direct-book:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated NFL development branch
        uses: actions/checkout@v4
        with:
          ref: nfl-model-development
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Timestamp direct sportsbook web-board capture
        run: python scripts/build_nfl_week6_direct_book_capture.py
      - name: Refresh public market movement tracker
        run: python scripts/build_nfl_week6_market_movement_tracker.py
      - name: Enforce market-observation safety policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('nfl_data/prospective/week6_public_market_movement_20261017.json')
          d=json.loads(p.read_text())
          assert d['website_publish_allowed'] is False
          assert d['release_state']=='HOLD_MARKET_OBSERVATION_ONLY'
          for r in d['rows']:
              assert r['movement_is_clv'] is False
              assert r['recommendation']=='HOLD_NO_VALIDATED_EDGE_THRESHOLD'
          print('market observation safety policy passed:', d['summary'])
          PY
      - name: Commit market capture and movement tracker safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl_data/prospective/market_captures/week6_betmgm_web_capture_*.csv nfl_data/prospective/market_captures/week6_betmgm_web_capture_*.json nfl_data/prospective/week6_public_market_movement_20261017.json nfl_data/prospective/week6_public_market_movement_20261017.csv
          if git diff --cached --quiet; then
            echo "No market capture changes to commit"
          else
            git commit -m "Capture NFL Week 6 direct sportsbook web prices"
            git pull --rebase origin nfl-model-development
            git push origin nfl-model-development
          fi
      - name: Verify immutable model snapshot unchanged and no website publication paths changed
        run: |
          if git diff --name-only HEAD~1 HEAD | grep 'nfl_data/prospective/week6_prelock_20261017T225656Z' ; then
            echo "Immutable prospective snapshot changed" >&2
            exit 1
          fi
          if git diff --name-only HEAD~1 HEAD | grep -E '^(data/|app\.js$|index\.html$|.*\.css$|.*\.js$)' ; then
            echo "Unexpected website path changed" >&2
            exit 1
          fi

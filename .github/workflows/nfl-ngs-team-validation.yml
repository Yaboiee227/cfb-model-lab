name: NFL team NGS validation (development only)

on:
  push:
    branches: [nfl-model-development]
    paths:
      - 'scripts/validate_nfl_ngs_team_v1.py'
      - '.github/workflows/nfl-ngs-team-validation.yml'
      - 'nfl_data/historical/team_week_ngs_2022_2025.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-ngs-team:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated NFL development branch
        uses: actions/checkout@v4
        with:
          ref: nfl-model-development
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy
      - name: Validate team-level Next Gen feature families
        run: python scripts/validate_nfl_ngs_team_v1.py
      - name: Commit NGS validation artifacts safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl_data/validation/ngs_team_v1_predictions.csv nfl_data/validation/ngs_team_v1_coefficients.csv nfl_data/validation/ngs_team_v1_qa.json
          if git diff --cached --quiet; then
            echo "No NGS validation changes to commit"
          else
            git commit -m "Validate team-level NFL NGS candidates"
            git pull --rebase origin nfl-model-development
            git push origin nfl-model-development
          fi

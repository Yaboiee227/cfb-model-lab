name: NFL Week 6 FTN50 Shadow Grade

on:
  workflow_dispatch:
  push:
    branches: [nfl-model-development]
    paths:
      - 'scripts/grade_nfl_week6_ftn50_shadow.py'
      - '.github/workflows/nfl-week6-ftn50-shadow-grade.yml'

permissions:
  contents: write

concurrency:
  group: nfl-week6-ftn50-shadow-grade-${{ github.ref }}
  cancel-in-progress: false

jobs:
  grade:
    if: github.ref == 'refs/heads/nfl-model-development'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NFL development branch
        uses: actions/checkout@v4
        with:
          ref: nfl-model-development
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Grade frozen shadow head-to-head
        run: python scripts/grade_nfl_week6_ftn50_shadow.py
      - name: Enforce research-only grading policy
        run: |
          python - <<'PY'
          import glob, json
          files=sorted(glob.glob('nfl_data/prospective/shadow_grades/week6_ftn50_shadow_grade_*.json'))
          assert files
          d=json.load(open(files[-1]))
          assert d['promotion_allowed'] is False
          assert d['recommendation_release_allowed'] is False
          assert d['website_publish_allowed'] is False
          print('shadow grade safety policy passed:', d['completed_games_graded'])
          PY
      - name: Verify immutable snapshots and live CFB site untouched
        run: |
          if git status --porcelain -- nfl_data/prospective/week6_prelock_20261017T225656Z.json nfl_data/prospective/week6_prelock_20261017T225656Z.csv nfl_data/prospective/shadow/week6_ftn50_shadow_20261017T235342Z.json nfl_data/prospective/shadow/week6_ftn50_shadow_20261017T235342Z.csv index.html app.js script.js styles.css data/projections.csv data/results.csv | grep .; then
            echo 'Frozen snapshot or live CFB path changed unexpectedly'
            exit 1
          fi
          echo 'Immutable snapshots and live CFB guards passed'
      - name: Commit grading artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nfl_data/prospective/shadow_grades/
          if git diff --cached --quiet; then
            echo 'No grading artifact changes'
          else
            git commit -m 'Grade Week 6 FTN50 shadow snapshot'
            git pull --rebase origin nfl-model-development
            git push origin nfl-model-development
          fi

name: NFL FTN charting build (development only)

on:
  push:
    branches: [nfl-model-development]
    paths:
      - 'scripts/build_nfl_ftn_charting_features.py'
      - '.github/workflows/nfl-ftn-charting-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ftn-charting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated NFL development branch
        uses: actions/checkout@v4
        with:
          ref: nfl-model-development
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas pyarrow
      - name: Build leakage-safe FTN charting features
        run: python scripts/build_nfl_ftn_charting_features.py
      - name: Commit FTN charting artifacts safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl_data/historical/team_week_ftn_charting_2022_2025.csv nfl_data/generated/ftn_charting_2026_week6_pregame.csv nfl_data/generated/ftn_charting_build_qa_2026_week6.json
          if git diff --cached --quiet; then
            echo "No FTN charting changes to commit"
          else
            git commit -m "Build leakage-safe NFL FTN charting features"
            git pull --rebase origin nfl-model-development
            git push origin nfl-model-development
          fi
      # Keep this workflow development-only; never publish website artifacts here.

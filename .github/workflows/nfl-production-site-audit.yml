name: NFL Production Research Site Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - index.html
      - league-bootstrap.js
      - live-suite-loader.js
      - nfl_data/site/**
      - .github/workflows/nfl-production-site-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check shared site JavaScript
        run: |
          node --check league-bootstrap.js
          node --check script.js
          node --check live-suite-loader.js

      - name: Audit public NFL research integration
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          import runpy, sys
          if json.loads(Path('nfl_data/site/config.json').read_text()).get('currentWeek') == 7:
              sys.path.insert(0, 'scripts')
              runpy.run_path('scripts/audit_nfl_week7_release.py', run_name='__main__')
              sys.exit(0)

          disclaimer = (
              'All content on CB Model Projections is model-generated and provided for research and entertainment purposes only. '
              'It is not betting advice and not an official wager recommendation. Past performance does not guarantee future results. '
              'Must be 21+ (or the legal age in your jurisdiction). If you or someone you know has a gambling problem, call 1-800-GAMBLER.'
          )

          html = Path('index.html').read_text(encoding='utf-8')
          bootstrap = Path('league-bootstrap.js').read_text(encoding='utf-8')
          live = Path('live-suite-loader.js').read_text(encoding='utf-8')
          cfg = json.loads(Path('nfl_data/site/config.json').read_text(encoding='utf-8'))
          research = json.loads(Path('nfl_data/site/research.json').read_text(encoding='utf-8'))

          with Path('nfl_data/site/projections.csv').open(encoding='utf-8', newline='') as f:
              reader = csv.DictReader(f)
              rows = list(reader)
              fields = set(reader.fieldnames or [])
          with Path('nfl_data/site/results.csv').open(encoding='utf-8', newline='') as f:
              result_reader = csv.DictReader(f)
              result_fields = set(result_reader.fieldnames or [])

          required_fields = {
              'league','season','week','gameId','awayTeam','homeTeam','projectedAwayPoints','projectedHomePoints',
              'modelSpreadHome','modelTotal','homeWinProbability','awayWinProbability','marketSpreadHome','marketTotal',
              'marketSource','marketObservedAt','executionVerified','releaseStatus','shadowModelSpreadHome',
              'spreadReliability','totalReliability','personnelState','hardQbStateBreak','weatherRoofState',
              'finalInactivesResolved','releaseBlockers','preferredArchitecture','winProbabilityState','websitePublishAllowed'
          }

          assert html.count('<script src="league-bootstrap.js" defer></script>') == 1
          assert html.index('league-bootstrap.js') < html.index('script.js')
          assert 'nfl_data/site/' in bootstrap
          assert 'cb-bookmarks-nfl' in bootstrap
          assert 'Research preview • HOLD' in bootstrap
          assert 'Model / market difference' in bootstrap
          assert 'Reliability is not betting confidence' in bootstrap
          assert 'alt-target-box' in bootstrap and 'alt-analysis-card' in bootstrap
          assert disclaimer in bootstrap
          assert "=== 'nfl'" in live

          assert cfg['league'] == 'NFL'
          assert cfg['separateNflSite'] is False
          assert cfg['leagueSwitchEnabled'] is True
          assert cfg['researchPublishAllowed'] is True
          assert cfg['websitePublishAllowed'] is True
          assert cfg['recommendationReleaseAllowed'] is False
          assert cfg['spreadValidation'] == 'HOLD'
          assert cfg['totalValidation'] == 'HOLD'
          assert cfg['moneylineEdgeValidation'] == 'HOLD'
          assert cfg['winProbabilityValidation'] == 'DISPLAY_VALIDATED_RESEARCH_ONLY'
          assert cfg['disclaimer'] == disclaimer

          # CFB-equivalent readiness must be explicit and must not masquerade as prediction accuracy.
          assert cfg['inputCoverageStandard'] == 'CFB_8_LAYER_EQUIVALENT'
          assert cfg['inputCoverageNominalThresholdPct'] == 90
          assert cfg['inputCoverageEffectiveRequiredLayers'] == '8/8'
          assert cfg['inputCoverageLayersPassed'] == 8
          assert cfg['inputCoverageLayersTotal'] == 8
          assert float(cfg['averageInputCoveragePct']) == 100.0
          assert cfg['gamesMeetingInputCoverageStandard'] == 13
          assert cfg['gamesInCurrentSlate'] == 13
          assert cfg['inputCoveragePass'] is True
          assert cfg['predictionAccuracy90PercentClaimed'] is False
          assert 'not prediction accuracy' in cfg['inputCoverageInterpretation'].lower()

          assert required_fields.issubset(fields)
          assert len(rows) == 13
          assert all(r['league'] == 'NFL' for r in rows)
          assert all(r['releaseStatus'].startswith('HOLD') for r in rows)
          assert all(r['websitePublishAllowed'].lower() == 'true' for r in rows)
          assert all(r['executionVerified'].lower() == 'false' for r in rows)
          assert all('benchmark' in r['marketSource'].lower() for r in rows)
          assert all(r['shadowModelSpreadHome'].strip() for r in rows)
          assert all(r['spreadReliability'].strip() and r['totalReliability'].strip() for r in rows)
          assert all(r['releaseBlockers'].strip() for r in rows)
          assert all(abs(float(r['homeWinProbability']) + float(r['awayWinProbability']) - 100) < 0.05 for r in rows)

          assert {'season','week','gameId','atsResult','suResult'}.issubset(result_fields)
          ids = {c.get('id') for c in research.get('categories', [])}
          assert {'readiness','availability','weather','market','efficiency','validation','workflow'}.issubset(ids)
          readiness = next(c for c in research['categories'] if c.get('id') == 'readiness')
          assert readiness['status'] == '8/8 · 100%'
          assert 'not prediction accuracy' in readiness['summary'].lower()

          print({
              'status': 'PASS_PUBLIC_NFL_RESEARCH__CFB90_INPUT_READY__RECOMMENDATIONS_HOLD',
              'projection_rows': len(rows),
              'input_coverage_pct': cfg['averageInputCoveragePct'],
              'games_meeting_standard': cfg['gamesMeetingInputCoverageStandard'],
              'research_publish': cfg['researchPublishAllowed'],
              'recommendation_release': cfg['recommendationReleaseAllowed'],
              'spread': cfg['spreadValidation'],
              'total': cfg['totalValidation'],
          })
          PY

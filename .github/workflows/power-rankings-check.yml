name: Power rankings validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/power-rankings/**'
      - 'scripts/*power_rankings.py'
      - 'tests/test_power_rankings.py'
      - 'power-rankings.js'
      - '.github/workflows/power-rankings-check.yml'
  pull_request:
    paths:
      - 'data/power-rankings/**'
      - 'tests/test_power_rankings.py'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: pytest -q tests/test_power_rankings.py
      - run: node --check power-rankings.js

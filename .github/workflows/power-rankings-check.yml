name: Power rankings build and validation

on:
  workflow_dispatch:
  push:
    branches:
      - cb-power-rankings-20261023
    paths:
      - 'scripts/build_power_rankings.py'
      - 'scripts/build_nfl_power_rankings.py'
      - 'tests/test_power_rankings.py'
      - 'ratings.html'
      - 'power-rankings.js'
      - 'power-rankings.css'
      - 'POWER_RANKINGS.md'
      - '.github/workflows/power-rankings-check.yml'

permissions:
  contents: write

concurrency:
  group: power-rankings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cb-power-rankings-20261023
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pytest

      - name: Materialize pinned frozen NFL model source
        run: |
          git fetch origin nfl-week7-live-release
          test "$(git rev-parse 0721b59b5f461ad590bd348bd655c4963265856c)" = "0721b59b5f461ad590bd348bd655c4963265856c"
          rm -rf /tmp/nfl-power
          git worktree add --detach /tmp/nfl-power 0721b59b5f461ad590bd348bd655c4963265856c
          cp scripts/build_nfl_power_rankings.py /tmp/nfl-power/scripts/build_nfl_power_rankings_cb.py
          mkdir -p "$GITHUB_WORKSPACE/.tmp-power"

      - name: Extract NFL frozen-model power ratings
        working-directory: /tmp/nfl-power
        run: |
          python scripts/build_nfl_power_rankings_cb.py \
            --source-commit 0721b59b5f461ad590bd348bd655c4963265856c \
            --output "$GITHUB_WORKSPACE/.tmp-power/nfl-model.json"

      - name: Build CFB and NFL rankings artifacts
        run: |
          python scripts/build_power_rankings.py \
            --nfl-model "$GITHUB_WORKSPACE/.tmp-power/nfl-model.json" \
            --output-dir data/power-rankings

      - name: Run ranking integrity suite
        run: pytest -q tests/test_power_rankings.py

      - name: Verify generated files are non-canonical research outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('cfb.json','nfl.json','manifest.json'):
              doc=json.loads((Path('data/power-rankings')/name).read_text())
              assert doc.get('canonicalInfluence') is False, name
              assert doc.get('canonicalPromotionAuthorized') is False, name
          print('non-canonical guard: PASS')
          PY

      - name: Commit generated ranking snapshot
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "cb-model-power-rankings-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/power-rankings/
          if git diff --cached --quiet; then
            echo "Power ranking snapshot already current."
            exit 0
          fi
          git commit -m "Build frozen research power rankings [skip ci]"
          git pull --rebase origin cb-power-rankings-20261023
          git push origin HEAD:cb-power-rankings-20261023

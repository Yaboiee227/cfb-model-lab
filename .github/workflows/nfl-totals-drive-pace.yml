name: NFL totals drive pace validation (development only)

on:
  workflow_dispatch:
  push:
    branches:
      - nfl-model-development
    paths:
      - 'scripts/validate_nfl_totals_drive_pace_v1.py'
      - 'nfl_data/historical/game_drive_pace_2022_2025.csv'
      - '.github/workflows/nfl-totals-drive-pace.yml'

permissions:
  contents: write

jobs:
  validate-totals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nfl-model-development
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Validate drive pace totals candidates
        run: python scripts/validate_nfl_totals_drive_pace_v1.py
      - name: Commit research-only totals validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl_data/validation/totals_drive_pace_v1_qa.json nfl_data/validation/totals_drive_pace_v1_predictions.csv nfl_data/validation/totals_drive_pace_v1_coefficients.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Validate NFL drive and pace totals candidates"
          git pull --rebase origin nfl-model-development
          git push origin HEAD:nfl-model-development

name: NFL injury schema probe (development only)

on:
  workflow_dispatch:
  push:
    branches:
      - nfl-model-development
    paths:
      - 'scripts/probe_nfl_injury_schema.py'
      - '.github/workflows/nfl-injury-schema-probe.yml'

permissions:
  contents: write

concurrency:
  group: nfl-model-development-injury-schema-probe
  cancel-in-progress: false

jobs:
  probe-injury-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated NFL development branch
        uses: actions/checkout@v4
        with:
          ref: nfl-model-development
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow
      - name: Probe current injury schemas
        run: python scripts/probe_nfl_injury_schema.py
      - name: Commit schema audit artifact safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl_data/generated/injury_schema_probe_2022_2026.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Probe NFL injury source schemas"
          for attempt in 1 2 3; do
            git fetch origin nfl-model-development
            if git rebase origin/nfl-model-development && git push origin HEAD:nfl-model-development; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1

name: NFL final architecture calibration (development only)

on:
  push:
    branches: [nfl-model-development]
    paths:
      - 'scripts/calibrate_nfl_final_architecture.py'
      - '.github/workflows/nfl-final-calibration.yml'
      - 'nfl_data/historical/game_pregame_features_2022_2025.csv'
      - 'nfl_data/historical/team_week_coverage_2022_2025.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calibrate-final-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated NFL development branch
        uses: actions/checkout@v4
        with:
          ref: nfl-model-development
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy pandas
      - name: Calibrate final research architecture
        run: python scripts/calibrate_nfl_final_architecture.py
      - name: Commit calibration artifacts safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl_data/calibration/final_architecture_oos_predictions_2023_2025.csv nfl_data/calibration/final_architecture_calibration.json
          if git diff --cached --quiet; then
            echo "No calibration changes to commit"
          else
            git commit -m "Calibrate final NFL research architecture"
            git pull --rebase origin nfl-model-development
            git push origin nfl-model-development
          fi
      - name: Verify no website publication paths changed
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -E '^(data/|app\.js$|index\.html$|.*\.css$|.*\.js$)' ; then
            echo "Unexpected website path changed" >&2
            exit 1
          fi

name: CFB offense-defense challenger validation

on:
  workflow_dispatch:
  push:
    branches:
      - cfb-model-week8-optimization-20261021
    paths:
      - scripts/cfb_offdef_challenger_validation.py
      - .github/workflows/cfb-offdef-challenger-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy
      - name: Compile challenger
        run: python -m py_compile scripts/cfb_offdef_challenger_validation.py
      - name: Run leakage-safe development holdout confirmation validation
        run: python scripts/cfb_offdef_challenger_validation.py
      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: cfb-offdef-challenger-validation
          path: cfb/validation/week-08-offdef-challenger-validation.json
          if-no-files-found: error

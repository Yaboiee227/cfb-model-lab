name: NFL special teams robustness (development only)

on:
  push:
    branches: [nfl-model-development]
    paths:
      - 'scripts/validate_nfl_special_teams_robustness.py'
      - '.github/workflows/nfl-special-teams-robustness.yml'
      - 'nfl_data/historical/team_week_special_teams_2022_2025.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  robust-special-teams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated NFL development branch
        uses: actions/checkout@v4
        with:
          ref: nfl-model-development
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy
      - name: Run frozen-parameter special teams robustness audit
        run: python scripts/validate_nfl_special_teams_robustness.py
      - name: Commit robustness artifact safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl_data/validation/special_teams_robustness.json
          if git diff --cached --quiet; then
            echo "No special teams robustness changes to commit"
          else
            git commit -m "Audit NFL special teams robustness"
            git pull --rebase origin nfl-model-development
            git push origin nfl-model-development
          fi

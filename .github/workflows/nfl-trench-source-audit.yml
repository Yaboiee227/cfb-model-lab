name: NFL trench source audit (development only)

on:
  push:
    branches: [nfl-model-development]
    paths:
      - 'scripts/audit_nfl_trench_sources.py'
      - '.github/workflows/nfl-trench-source-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-trench-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated NFL development branch
        uses: actions/checkout@v4
        with:
          ref: nfl-model-development
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas pyarrow
      - name: Audit trench source schemas and coverage
        run: python scripts/audit_nfl_trench_sources.py
      - name: Commit research audit safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl_data/generated/trench_source_audit_2026_week6.json
          if git diff --cached --quiet; then
            echo "No audit changes to commit"
          else
            git commit -m "Audit NFL trench source coverage"
            git push origin nfl-model-development
          fi

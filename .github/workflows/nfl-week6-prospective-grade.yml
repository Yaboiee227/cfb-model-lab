name: NFL Week 6 prospective grade (development only)

on:
  push:
    branches: [nfl-model-development]
    paths:
      - 'scripts/grade_nfl_week6_prospective_snapshot.py'
      - '.github/workflows/nfl-week6-prospective-grade.yml'
      - 'nfl_data/prospective/week6_prelock_20261017T225656Z.json'
      - 'nfl_data/prospective/market_captures/week6_betmgm_web_capture_20261017T225910Z.json'
      - 'nfl_data/prospective/week6_readiness_matrix_20261017.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grade-prospective-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated NFL development branch
        uses: actions/checkout@v4
        with:
          ref: nfl-model-development
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Grade completed games without modifying frozen evidence
        run: python scripts/grade_nfl_week6_prospective_snapshot.py
      - name: Assert prospective grading safety policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('nfl_data/prospective/grades').glob('week6_grade_*.json'), key=lambda p: p.stat().st_mtime)
          assert files, 'No grade JSON produced'
          data = json.loads(files[-1].read_text())
          assert data['website_publish_allowed'] is False
          assert 'disabled' in data['roi_policy'].lower()
          assert 'not proof of executable prices' in data['public_book_benchmark_policy']
          assert all(r.get('roi_grade_allowed') is False for r in data.get('rows', []))
          assert all(r.get('website_publish_allowed') is False for r in data.get('rows', []))
          print('Prospective grading safety policy passed.')
          PY
      - name: Commit grading artifacts safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl_data/prospective/grades/week6_grade_*.json
          if compgen -G "nfl_data/prospective/grades/week6_grade_*.csv" > /dev/null; then
            git add nfl_data/prospective/grades/week6_grade_*.csv
          fi
          if git diff --cached --quiet; then
            echo "No prospective grading changes to commit"
          else
            git commit -m "Grade NFL Week 6 prospective snapshot"
            for attempt in 1 2 3; do
              git fetch origin nfl-model-development
              if git rebase origin/nfl-model-development && git push origin HEAD:nfl-model-development; then
                exit 0
              fi
              git rebase --abort || true
              sleep $((attempt * 2))
            done
            echo "Unable to update development branch after retrying."
            exit 1
          fi
      - name: Verify immutable evidence unchanged and no website publication paths changed
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -E 'nfl_data/prospective/(week6_prelock_20261017T225656Z|market_captures/week6_betmgm_web_capture_20261017T225910Z|week6_readiness_matrix_20261017)' ; then
            echo "Immutable prospective evidence changed" >&2
            exit 1
          fi
          if git diff --name-only HEAD~1 HEAD | grep -E '^(data/|app\.js$|index\.html$|.*\.css$|.*\.js$)' ; then
            echo "Unexpected website path changed" >&2
            exit 1
          fi

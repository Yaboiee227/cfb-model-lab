name: Responsive site smoke test
on:
  push:
    paths:
      - 'index.html'
      - 'week-8.html'
      - 'recap.html'
      - 'ratings.html'
      - '*.js'
      - '*.css'
      - 'data/**'
      - 'cfb/results/**'
      - 'nfl_data/site/**'
      - 'scripts/site_smoke_test.mjs'
      - 'scripts/site_webkit_mobile_test.mjs'
      - 'scripts/site_shell_guard_test.mjs'
      - 'scripts/site_static_pages_test.mjs'
      - '.github/workflows/site-smoke-test.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: responsive-site-smoke
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium and WebKit
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Start local site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/cb-site.log 2>&1 &
          echo $! > /tmp/cb-site.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cb-site.log
          exit 1
      - name: Run local desktop and mobile Chromium checks
        run: node scripts/site_smoke_test.mjs
      - name: Run local iPhone WebKit checks
        env:
          SITE_SMOKE_OUT: artifacts/site-webkit-local
        run: node scripts/site_webkit_mobile_test.mjs
      - name: Run local responsive shell guard checks
        run: node scripts/site_shell_guard_test.mjs
      - name: Run local recap and ratings checks
        run: node scripts/site_static_pages_test.mjs
      - name: Upload local screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-site-smoke-local
          path: |
            artifacts/site-smoke/
            artifacts/site-webkit-local/
          retention-days: 7
      - name: Wait for current site assets to reach Pages
        shell: bash
        run: |
          set -euo pipefail
          base='https://yaboiee227.github.io/cfb-model-lab'
          for i in {1..36}; do
            nav="$(curl -fsS "${base}/slate-navigation.js?qa=${GITHUB_RUN_ID}" || true)"
            css="$(curl -fsS "${base}/slate-navigation.css?qa=${GITHUB_RUN_ID}" || true)"
            boot="$(curl -fsS "${base}/league-bootstrap.js?qa=${GITHUB_RUN_ID}" || true)"
            loader="$(curl -fsS "${base}/live-suite-loader.js?qa=${GITHUB_RUN_ID}" || true)"
            shellfix="$(curl -fsS "${base}/site-shell-hotfix.css?qa=${GITHUB_RUN_ID}" || true)"
            guard="$(curl -fsS "${base}/site-runtime-guard.js?qa=${GITHUB_RUN_ID}" || true)"
            audit="$(curl -fsS "${base}/audit-shell.css?qa=${GITHUB_RUN_ID}" || true)"
            if grep -q 'openCurrentWeekProjections' <<<"$nav" \
              && grep -q 'content-visibility:visible' <<<"$css" \
              && grep -q 'SITE_DATA_FILES' <<<"$boot" \
              && grep -q '20261022-shared-responsive-v5' <<<"$loader" \
              && grep -q 'CB_SHELL_HARDENING_V4' <<<"$shellfix" \
              && grep -q '__CB_SITE_RUNTIME_GUARD' <<<"$guard" \
              && grep -q 'scroll-padding-top:122px' <<<"$audit"; then
              echo 'Current full-slate, fresh-data and responsive-shell assets are live on Pages.'
              exit 0
            fi
            sleep 10
          done
          echo 'GitHub Pages did not expose the current responsive/full-slate assets in time.' >&2
          exit 1
      - name: Run deployed Pages desktop and mobile Chromium checks
        env:
          SITE_BASE_URL: https://yaboiee227.github.io/cfb-model-lab
          SITE_SMOKE_OUT: artifacts/site-smoke-production
        run: node scripts/site_smoke_test.mjs
      - name: Run deployed Pages iPhone WebKit checks
        env:
          SITE_BASE_URL: https://yaboiee227.github.io/cfb-model-lab
          SITE_SMOKE_OUT: artifacts/site-webkit-production
        run: node scripts/site_webkit_mobile_test.mjs
      - name: Run deployed responsive shell guard checks
        env:
          SITE_BASE_URL: https://yaboiee227.github.io/cfb-model-lab
        run: node scripts/site_shell_guard_test.mjs
      - name: Run deployed recap and ratings checks
        env:
          SITE_BASE_URL: https://yaboiee227.github.io/cfb-model-lab
        run: node scripts/site_static_pages_test.mjs
      - name: Upload deployed-site screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-site-smoke-production
          path: |
            artifacts/site-smoke-production/
            artifacts/site-webkit-production/
          retention-days: 7

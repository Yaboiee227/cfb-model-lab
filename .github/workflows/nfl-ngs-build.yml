name: NFL Next Gen feature build (development only)

on:
  workflow_dispatch:
  push:
    branches:
      - nfl-model-development
    paths:
      - 'scripts/build_nfl_ngs_features.py'
      - '.github/workflows/nfl-ngs-build.yml'

permissions:
  contents: write

concurrency:
  group: nfl-model-development-ngs-build
  cancel-in-progress: false

jobs:
  build-ngs-features:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated NFL development branch
        uses: actions/checkout@v4
        with:
          ref: nfl-model-development
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build leakage-safe NGS current and historical features
        run: python scripts/build_nfl_ngs_features.py

      - name: Commit generated NGS research artifacts safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl_data/generated/ngs_*.csv nfl_data/generated/ngs_*.json nfl_data/historical/team_week_ngs_2022_2025.csv
          if git diff --cached --quiet; then
            echo "No NGS generated data changes."
            exit 0
          fi
          git commit -m "Build NFL Next Gen research features"
          for attempt in 1 2 3; do
            git fetch origin nfl-model-development
            if git rebase origin/nfl-model-development && git push origin HEAD:nfl-model-development; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          echo "Unable to update development branch after retrying."
          exit 1

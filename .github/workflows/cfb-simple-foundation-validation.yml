name: CFB simple foundation validation
on:
  push:
    paths:
      - 'scripts/cfb_simple_foundation_validation.py'
      - 'tests/test_cfb_simple_foundation_validation.py'
      - 'scripts/cfb_shadow_engine.py'
      - 'scripts/run_cfb_shadow_week8.py'
      - '.github/workflows/cfb-simple-foundation-validation.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cfb-simple-foundation-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy
      - name: Test foundation helpers
        run: python -m unittest tests.test_cfb_simple_foundation_validation -v
      - name: Run development-holdout-confirmation validation
        run: |
          python scripts/cfb_simple_foundation_validation.py \
            --as-of '2026-10-20T00:00:00-04:00' \
            --output cfb/validation/week-08-simple-foundation-validation.json
      - name: Assert clean holdout design
        run: |
          python - <<'PY'
          import json
          p='cfb/validation/week-08-simple-foundation-validation.json'
          d=json.load(open(p))
          assert d['role']=='SIMPLE_REBUILD_FOUNDATION_VALIDATION'
          assert d['canonicalInfluence'] is False
          assert d['canonicalPromotionAuthorized'] is False
          policy=d['policy']
          assert policy['developmentSeason']==2024
          assert policy['holdoutSeason']==2025
          assert policy['confirmationSeason']==2026
          assert policy['hyperparametersLockedAfter2024'] is True
          assert policy['teamStateResetEverySeason'] is True
          assert policy['structuralHfaAlwaysPriorSeasonsOnly'] is True
          assert policy['marketDataUsed'] is False
          assert policy['externalRatingsUsed'] is False
          locked=d['lockedDevelopmentCandidate']
          assert locked['holdout2025']['aggregate']['coverage'] >= 0.85
          assert locked['confirmation2026PreWeek8']['aggregate']['coverage'] >= 0.85
          print(json.dumps({
              'status':locked['status'],
              'selectedParams':locked['params'],
              'development2024':locked['development2024']['aggregate'],
              'holdout2025':locked['holdout2025']['aggregate'],
              'confirmation2026':locked['confirmation2026PreWeek8']['aggregate'],
              'currentLead2025':d['currentLeadShadowSettings']['holdout2025']['aggregate'],
              'currentLead2026':d['currentLeadShadowSettings']['confirmation2026PreWeek8']['aggregate'],
          },indent=2))
          PY
      - name: Commit foundation evidence
        run: |
          git config user.name "cb-model-validation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cfb/validation/week-08-simple-foundation-validation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh CFB simple foundation validation'
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main
          done
          git push

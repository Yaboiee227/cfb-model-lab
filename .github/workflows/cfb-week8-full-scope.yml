name: CFB Week 8 full remaining scope

on:
  push:
    branches: [main]
    paths:
      - 'scripts/cfb_week8_full_scope.py'
      - '.github/workflows/cfb-week8-full-scope.yml'
      - 'cfb/pregame/week-08-schedule.json'
      - 'cfb/research-locks/week-08-foundation-full.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cfb-week8-full-scope
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build resumed full-week scope
        run: python scripts/cfb_week8_full_scope.py
      - name: Validate scope boundaries
        run: |
          python - <<'PY'
          import json
          p='cfb/pregame/week-08-active-full-week.json'
          d=json.load(open(p))
          assert d['role']=='ACTIVE_PREGAME_PROCESSING_SCOPE'
          assert d['status']=='ACTIVE_REMAINING_FULL_WEEK'
          assert d['canonicalInfluence'] is False
          assert d['canonicalPromotionAuthorized'] is False
          assert d['includedGameCount']==53
          assert d['dateWindowET']==['2026-10-21','2026-10-24']
          assert d['processingRules']['fridayProcessingAuthorized'] is True
          assert d['processingRules']['saturdayProcessingAuthorized'] is True
          assert d['processingRules']['gradingDeferredUntilWeekComplete'] is True
          assert d['pauseBoundary'] is None
          assert len({g['foundationDigest'] for g in d['games']})==53
          print('full remaining Week 8 scope validated')
          PY
      - name: Commit resumed scope
        run: |
          git config user.name "cb-model-pregame-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cfb/pregame/week-08-active-full-week.json
          if git diff --cached --quiet; then
            echo 'No full-week scope change.'
            exit 0
          fi
          git commit -m 'Activate remaining Week 8 CFB pregame scope'
          git pull --rebase origin main
          git push

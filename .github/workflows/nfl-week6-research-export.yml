name: NFL Week 6 research export contract (development only)

on:
  push:
    branches: [nfl-model-development]
    paths:
      - 'scripts/build_nfl_week6_research_export.py'
      - 'nfl_data/prospective/week6_prelock_20261017T225656Z.json'
      - 'nfl_data/prospective/week6_projection_reliability_20261017T230853Z.json'
      - 'nfl_data/prospective/market_captures/week6_betmgm_web_capture_20261017T225910Z.json'
      - 'nfl_data/validation/model_readiness.json'
      - '.github/workflows/nfl-week6-research-export.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-research-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated NFL development branch
        uses: actions/checkout@v4
        with:
          ref: nfl-model-development
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build development-only research export contract
        run: python scripts/build_nfl_week6_research_export.py
      - name: Commit research export safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl_data/research_exports/week6_research_export_*.json
          if git diff --cached --quiet; then
            echo "No research export artifact to commit"
          else
            git commit -m "Build NFL Week 6 research export contract"
            git pull --rebase origin nfl-model-development
            git push origin nfl-model-development
          fi
      - name: Verify research export cannot leak to website paths
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -E '^(data/|app\.js$|index\.html$|.*\.css$|.*\.js$)' ; then
            echo "Unexpected website path changed" >&2
            exit 1
          fi
          python - <<'PY'
          import glob,json
          p=sorted(glob.glob('nfl_data/research_exports/week6_research_export_*.json'))[-1]
          d=json.load(open(p))
          assert d['website_publish_allowed'] is False
          assert d['live_site_target'] is None
          assert all(g['release']['website_publish_allowed'] is False for g in d['games'])
          print('Research export publication guard passed:', p)
          PY

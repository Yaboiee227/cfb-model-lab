name: NFL injury personnel robustness (development only)

on:
  push:
    branches: [nfl-model-development]
    paths:
      - 'scripts/validate_nfl_injury_personnel_robustness.py'
      - '.github/workflows/nfl-injury-personnel-robustness.yml'
      - 'nfl_data/historical/team_week_injury_personnel_2022_2025.csv'
      - 'nfl_data/historical/team_week_coverage_2022_2025.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  robust-injury-personnel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated NFL development branch
        uses: actions/checkout@v4
        with:
          ref: nfl-model-development
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy
      - name: Run frozen injury personnel robustness audit
        run: python scripts/validate_nfl_injury_personnel_robustness.py
      - name: Commit robustness artifact safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl_data/validation/injury_personnel_robustness.json
          if git diff --cached --quiet; then
            echo "No injury robustness changes to commit"
          else
            git commit -m "Audit NFL injury personnel robustness"
            git pull --rebase origin nfl-model-development
            git push origin nfl-model-development
          fi

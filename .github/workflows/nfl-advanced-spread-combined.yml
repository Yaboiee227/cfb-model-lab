name: NFL advanced spread combined validation (development only)

on:
  push:
    branches: [nfl-model-development]
    paths:
      - 'scripts/validate_nfl_advanced_spread_combined.py'
      - '.github/workflows/nfl-advanced-spread-combined.yml'
      - 'nfl_data/historical/team_week_coverage_2022_2025.csv'
      - 'nfl_data/historical/team_week_turnover_regression_2022_2025.csv'
      - 'nfl_data/historical/team_week_special_teams_2022_2025.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-combined-spread:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated NFL development branch
        uses: actions/checkout@v4
        with:
          ref: nfl-model-development
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy
      - name: Validate nested frozen advanced spread candidates
        run: python scripts/validate_nfl_advanced_spread_combined.py
      - name: Commit combined validation artifact safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl_data/validation/advanced_spread_combined.json
          if git diff --cached --quiet; then
            echo "No combined validation changes to commit"
          else
            git commit -m "Validate combined NFL advanced spread candidates"
            git pull --rebase origin nfl-model-development
            git push origin nfl-model-development
          fi

name: NFL turnover regression build (development only)

on:
  push:
    branches: [nfl-model-development]
    paths:
      - 'scripts/build_nfl_turnover_regression_features.py'
      - '.github/workflows/nfl-turnover-regression-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-turnover-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated NFL development branch
        uses: actions/checkout@v4
        with:
          ref: nfl-model-development
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas
      - name: Build leakage-safe turnover regression features
        run: python scripts/build_nfl_turnover_regression_features.py
      - name: Commit turnover regression artifacts safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl_data/historical/team_week_turnover_regression_2022_2025.csv nfl_data/generated/turnover_regression_2026_week6_pregame.csv nfl_data/generated/turnover_regression_build_qa_2026_week6.json
          if git diff --cached --quiet; then
            echo "No turnover regression changes to commit"
          else
            git commit -m "Build leakage-safe NFL turnover regression features"
            git pull --rebase origin nfl-model-development
            git push origin nfl-model-development
          fi

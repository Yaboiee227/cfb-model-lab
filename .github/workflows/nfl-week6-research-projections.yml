name: NFL Week 6 research projections (development only)

on:
  push:
    branches: [nfl-model-development]
    paths:
      - 'scripts/build_nfl_week6_research_projections.py'
      - '.github/workflows/nfl-week6-research-projections.yml'
      - 'nfl_data/generated/coverage_2026_week6_pregame.csv'
      - 'nfl_data/historical/game_pregame_features_2022_2025.csv'
      - 'nfl_data/historical/team_week_coverage_2022_2025.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-week6-research-projections:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated NFL development branch
        uses: actions/checkout@v4
        with:
          ref: nfl-model-development
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy pandas
      - name: Build isolated Week 6 research projections
        run: python scripts/build_nfl_week6_research_projections.py
      - name: Commit research artifacts safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl_data/generated/week6_research_projections.csv nfl_data/generated/week6_research_projections_qa.json
          if git diff --cached --quiet; then
            echo "No Week 6 research projection changes to commit"
          else
            git commit -m "Build NFL Week 6 research projections"
            git pull --rebase origin nfl-model-development
            git push origin nfl-model-development
          fi
      - name: Verify no website publication paths changed
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -E '^(data/|app\.js$|index\.html$|.*\.css$|.*\.js$)' ; then
            echo "Unexpected website path changed" >&2
            exit 1
          fi

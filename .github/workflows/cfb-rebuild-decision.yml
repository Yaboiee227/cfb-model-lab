name: CFB rebuild decision registry
on:
  push:
    paths:
      - 'scripts/cfb_rebuild_decision.py'
      - 'tests/test_cfb_rebuild_decision.py'
      - 'cfb/shadow/week-08-tuesday-foundation.json'
      - 'cfb/shadow/week-08-tuesday-rich.json'
      - 'cfb/validation/week-08-simple-foundation-validation.json'
      - 'cfb/validation/week-08-multiseason-walkforward.json'
      - 'cfb/validation/week-08-foundation-feature-family-validation.json'
      - 'cfb/validation/week-07-canonical-reference.json'
      - '.github/workflows/cfb-rebuild-decision.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cfb-rebuild-decision
  cancel-in-progress: false
jobs:
  decide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Test decision registry
        run: python -m unittest tests.test_cfb_rebuild_decision -v
      - name: Build decision registry
        run: python scripts/cfb_rebuild_decision.py
      - name: Assert validated foundation without implicit promotion
        run: |
          python - <<'PY'
          import json
          p='cfb/validation/week-08-rebuild-decision.json'
          d=json.load(open(p))
          assert d['status']=='VALIDATED_FOUNDATION_CANDIDATE_IDENTIFIED', d
          assert d['leadRebuildCandidate']=='cfb-rebuild-foundation-v1-shadow', d
          assert d['leadCandidateTier']=='VALIDATED_FOUNDATION_PROSPECTIVE_SHADOW'
          assert d['canonicalInfluence'] is False
          assert d['canonicalPromotionAuthorized'] is False
          assert d['week8Policy']['useLeadCandidateAsCanonical'] is False
          assert d['week8Policy']['publishLeadCandidateAsEstablished09J'] is False
          assert d['evidence']['richBundle']['evidenceStatus']=='RICH_REJECTED'
          assert d['evidence']['incrementalFeatureFamiliesAgainstFoundation']['eligibleFamilies']==[]
          print(json.dumps({'status':d['status'],'lead':d['leadRebuildCandidate'],'tier':d['leadCandidateTier'],'canonicalPromotionAuthorized':d['canonicalPromotionAuthorized']}, indent=2))
          PY
      - name: Commit decision registry
        run: |
          git config user.name "cb-model-validation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cfb/validation/week-08-rebuild-decision.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh Week 8 rebuild decision registry'
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main
          done
          git push

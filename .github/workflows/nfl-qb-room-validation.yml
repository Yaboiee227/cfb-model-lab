name: NFL QB room validation (development only)

on:
  workflow_dispatch:
  push:
    branches:
      - nfl-model-development
    paths:
      - 'scripts/validate_nfl_qb_room_v1.py'
      - 'nfl_data/historical/team_week_qb_room_2022_2025.csv'
      - '.github/workflows/nfl-qb-room-validation.yml'

permissions:
  contents: write

concurrency:
  group: nfl-model-development-qb-room-validation
  cancel-in-progress: false

jobs:
  validate-qb-room:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated NFL development branch
        uses: actions/checkout@v4
        with:
          ref: nfl-model-development
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy

      - name: Run leakage-safe QB walk-forward tests
        run: python scripts/validate_nfl_qb_room_v1.py

      - name: Commit validation research artifacts safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl_data/validation/qb_room_v1_*.csv nfl_data/validation/qb_room_v1_*.json
          if git diff --cached --quiet; then
            echo "No QB validation artifact changes."
            exit 0
          fi
          git commit -m "Validate NFL QB room research features"
          for attempt in 1 2 3; do
            git fetch origin nfl-model-development
            if git rebase origin/nfl-model-development && git push origin HEAD:nfl-model-development; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          echo "Unable to update development branch after retrying."
          exit 1

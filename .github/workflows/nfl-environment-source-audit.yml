name: NFL environment source audit (development only)

on:
  push:
    branches: [nfl-model-development]
    paths:
      - 'scripts/audit_nfl_environment_sources.py'
      - '.github/workflows/nfl-environment-source-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-environment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated NFL development branch
        uses: actions/checkout@v4
        with:
          ref: nfl-model-development
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas
      - name: Audit schedule/environment source coverage
        run: python scripts/audit_nfl_environment_sources.py
      - name: Commit audit artifact safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl_data/generated/environment_source_audit_2021_2026.json
          if git diff --cached --quiet; then
            echo "No environment audit changes to commit"
          else
            git commit -m "Audit NFL environment source coverage"
            git pull --rebase origin nfl-model-development
            git push origin nfl-model-development
          fi

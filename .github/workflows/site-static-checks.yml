name: Site static checks

on:
  pull_request:
    paths:
      - 'site-shell.css'
      - 'site-shell.js'
      - 'site-runtime-guard.js'
      - 'audit-shell.css'
      - 'recap.html'
      - 'ratings.html'
      - 'power-rankings.js'
      - 'power-rankings.css'
      - 'power-rankings-phase3.js'
      - 'power-rankings-phase3.css'
      - 'slate-navigation.js'
      - 'live-suite-loader.js'
      - 'live-data.js'
      - 'cb-foundation.css'
      - 'cb-foundation.js'
      - 'cb-team-visuals.css'
      - 'cb-team-visuals.js'
      - 'cb-game-cards.css'
      - 'cb-game-cards.js'
      - 'cb-phase3.css'
      - 'cb-phase3.js'
      - 'assets/teams/**'
      - 'data/power-rankings/**'
      - 'tests/test_website_redesign.py'
      - 'tests/test_phase3_website.py'
      - '.github/workflows/site-static-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run redesign regression tests
        run: python -m pytest tests/test_website_redesign.py tests/test_phase3_website.py -q
      - name: Check standalone JavaScript syntax
        run: |
          node --check site-shell.js
          node --check live-suite-loader.js
          node --check site-runtime-guard.js
          node --check slate-navigation.js
          node --check power-rankings.js
          node --check power-rankings-phase3.js
          node --check live-data.js
          node --check cb-foundation.js
          node --check assets/teams/team-assets.js
          node --check cb-team-visuals.js
          node --check cb-game-cards.js
          node --check cb-phase3.js
      - name: Extract and check remaining inline page scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          name = 'recap.html'
          text = Path(name).read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S | re.I)
          if not scripts:
              raise SystemExit(f'No inline script found in {name}')
          target = Path('/tmp') / f'{name}.js'
          target.write_text('\n'.join(scripts), encoding='utf-8')
          print(target)
          PY
          node --check /tmp/recap.html.js
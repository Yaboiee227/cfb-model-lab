name: Site static checks

on:
  pull_request:
    paths:
      - 'site-shell.css'
      - 'site-shell.js'
      - 'audit-shell.css'
      - 'recap.html'
      - 'ratings.html'
      - 'live-suite-loader.js'
      - 'tests/test_website_redesign.py'
      - '.github/workflows/site-static-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run redesign regression tests
        run: python -m pytest tests/test_website_redesign.py -q
      - name: Check standalone JavaScript syntax
        run: |
          node --check site-shell.js
          node --check live-suite-loader.js
      - name: Extract and check inline page scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ('recap.html', 'ratings.html'):
              text = Path(name).read_text(encoding='utf-8')
              scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S | re.I)
              if not scripts:
                  raise SystemExit(f'No inline script found in {name}')
              target = Path('/tmp') / f'{name}.js'
              target.write_text('\n'.join(scripts), encoding='utf-8')
              print(target)
          PY
          node --check /tmp/recap.html.js
          node --check /tmp/ratings.html.js

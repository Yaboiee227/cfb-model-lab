name: NFL historical pregame build (development only)

on:
  workflow_dispatch:
  push:
    branches:
      - nfl-model-development
    paths:
      - 'scripts/build_nfl_historical_features.py'
      - 'scripts/validate_nfl_multifeature_residual_v1.py'
      - '.github/workflows/nfl-historical-build.yml'

permissions:
  contents: write

concurrency:
  group: nfl-model-development-historical-build
  cancel-in-progress: false

jobs:
  build-historical-pregame:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated NFL development branch
        uses: actions/checkout@v4
        with:
          ref: nfl-model-development
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build 2022-2025 leakage-safe pregame history
        run: python scripts/build_nfl_historical_features.py

      - name: Validate multifeature market-residual model
        run: python scripts/validate_nfl_multifeature_residual_v1.py

      - name: Commit historical and validation research files safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl_data/historical/ nfl_data/validation/
          if git diff --cached --quiet; then
            echo "No historical/validation changes."
            exit 0
          fi
          git commit -m "Build and validate NFL historical pregame research"
          for attempt in 1 2 3; do
            git fetch origin nfl-model-development
            if git rebase origin/nfl-model-development && git push origin HEAD:nfl-model-development; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          echo "Unable to update development branch after retrying."
          exit 1

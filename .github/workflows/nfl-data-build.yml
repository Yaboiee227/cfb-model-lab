name: NFL model data build (development only)

on:
  workflow_dispatch:
  push:
    branches:
      - nfl-model-development
    paths:
      - 'scripts/build_nfl_efficiency.py'
      - 'scripts/build_nfl_pbp_features.py'
      - 'scripts/validate_nfl_feature_layers.py'
      - 'scripts/build_nfl_opponent_adjusted.py'
      - 'scripts/validate_nfl_opponent_adjusted_walkforward.py'
      - '.github/workflows/nfl-data-build.yml'

permissions:
  contents: write

jobs:
  build-current-nfl-efficiency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated NFL development branch
        uses: actions/checkout@v4
        with:
          ref: nfl-model-development
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Week 6 summary-stat snapshot from Weeks 1-5 only
        run: python scripts/build_nfl_efficiency.py

      - name: Build Week 6 play-by-play feature snapshot from Weeks 1-5 only
        run: python scripts/build_nfl_pbp_features.py

      - name: Cross-check independent NFL feature layers
        run: python scripts/validate_nfl_feature_layers.py

      - name: Build Week 6 opponent-adjusted research ratings
        run: python scripts/build_nfl_opponent_adjusted.py

      - name: Run historical walk-forward validation
        run: python scripts/validate_nfl_opponent_adjusted_walkforward.py

      - name: Commit generated development data and validation artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl_data/generated/ nfl_data/validation/
          if git diff --cached --quiet; then
            echo "No generated data changes."
            exit 0
          fi
          git commit -m "Build and validate NFL pregame research layers"
          git push origin HEAD:nfl-model-development

ab"><svg data-test-id="s-icon__root" focusable="false" role="img" fill="currentColor" style="" class="s-icon s-icon-social-linkedin s-icon--size-regular" aria-hidden="true"><use xlink:href="/sidearm-icons-social.svg#icon-social-linkedin"></use></svg></a></div></div><!----><!----><!----></div><div class="flex pt-[32px]"><!----><div id="storyContainer" tabindex="-1" class="relative w-full print:static"><!--[--><span></span><!----><div data-sidearm-html="true" data-safe-html="true" id="storyPageContentBody" tabindex="-1" class="story-page__content__body s-text-paragraph-longform text-theme-safe min-h-[200px] max-w-none prose"><p lang="EN-US" paraeid="{73ff7dd1-ec47-4025-9f1c-bf16228cf482}{164}" paraid="1719881657"><strong>Game 7 • vs NM State <br>
Huntsville • Bowers Stadium (14,500) <br>
NM State (2-4, 1-1 CUSA) at Sam Houston (1-5, 0-2 CUSA) <br>
Wednesday, October 21 • 7:00 PM CT   </strong></p>

<p lang="EN-US" paraeid="{73ff7dd1-ec47-4025-9f1c-bf16228cf482}{199}" paraid="29811262"><strong>TV: ESPN2</strong> (Jorge Sedano, Rodney McLeod, Kendra Douglas) <br>
<strong>RADIO: BSN</strong> (Jason Barfield, Brian Adams); <strong>KSHU 90.5 FM  </strong> </p>

<p lang="EN-US" paraeid="{73ff7dd1-ec47-4025-9f1c-bf16228cf482}{220}" paraid="493963652"><strong>HOW TO FOLLOW: <a href="https://stats.statbroadcast.com/broadcast/?id=673114" rel="noreferrer noopener" target="_blank">Live Stats</a> • @BearkatsFB on X <br>
GAME NOTES: <a href="https://gobearkats.com/documents/2026/10/20/Game_7_vs_NMSU.pdf" rel="noreferrer noopener" target="_blank">Sam Houston</a> • <a href="https://gobearkats.com/documents/2026/10/20/GN7_-_at_Sam_Houston_-_FINAL.pdf" rel="noreferrer noopener" target="_blank">NM State</a> <br>
Series vs the Aggies: NMSU leads 2-1   </strong></p>

<p lang="EN-US" paraeid="{3e166f19-1500-41f4-ba1a-c2c8e6d9280d}{5}" paraid="441677526"><strong>HUNTSVILLE –</strong> Sam Houston looks to get into the win column in CUSA play on Wednesday night when it hosts NM State at Bowers Stadium. </p>

<p lang="EN-US" paraeid="{3e166f19-1500-41f4-ba1a-c2c8e6d9280d}{12}" paraid="1929240047">Kickoff for Wednesday's game is set for 7:00 p.m. CT and will air on ESPN2. Jorge Sedano and Rodney McLeod will have the call from Bowers Stadium with Kendra Douglas reporting from the sidelines. </p>

<p lang="EN-US" paraeid="{3e166f19-1500-41f4-ba1a-c2c8e6d9280d}{19}" paraid="1431270465">The game can also be heard on the Bearkat Sports Network with Jason Barfield and Brian Adams on the call. The BSN broadcast can be heard online on GoBearkats.com, the Bearkat Sports app and locally on KSHU 90.5 FM. </p>

<p lang="EN-US" paraeid="{3e166f19-1500-41f4-ba1a-c2c8e6d9280d}{26}" paraid="1070579775"><u><strong>KATS CHASE FIRST CUSA WIN AGAINST NM STATE</strong></u> <br>
- Wednesday's matchup features one of the nation's top passing defenses against an NM State offense averaging 230.5 yards through the air. Sam Houston has held five of its first six opponents below 200 passing yards and leads CUSA while ranking fourth nationally with 137.8 passing yards allowed per game <br>
 <br>
- Sam Houston ranks second nationally in year-to-year improvement in total defense, allowing 145.3 fewer yards per game than in 2025. The Kats have limited opponents to 338.2 yards per game after surrendering 483.5 last season <br>
 <br>
- The Kats held WKU to 276 yards of total offense last week, the fewest allowed by Sam Houston against an FBS opponent since limiting FIU to 199 yards in a 10-7 victory in 2024. The Hilltoppers averaged just 3.7 yards per play and were held out of the end zone for the game's final three quarters <br>
 <br>
- <dfn><a href="/sports/football/roster/landyn-locke/10283" rel="smarttag" rev="10283">Landyn Locke's</a></dfn> 11 touchdown passes have averaged 34.5 yards, the second-highest average among FBS quarterbacks with at least 10 TD tosses this season. Locke's six touchdown passes of at least 30 yards are tied for sixth nationally and double the Kats' team total from the entire 2025 season <br>
 <br>
- Locke is the only CUSA quarterback ranked among the league's top two in both passing yards per game (236.3, second) and touchdown passes (11, tied second) <br>
 <br>
- True freshmen <dfn><a href="/sports/football/roster/myles-joseph/12072" rel="smarttag" rev="12072">Myles Joseph</a></dfn> and <dfn><a href="/sports/football/roster/tr-e-williams/10899" rel="smarttag" rev="10899">Tr'e Williams</a></dfn> have started alongside one another on the offensive line in each of the last two games. According to Stats Perform, Sam Houston is the only FBS team to start two true freshmen on the offensive line in the same game this season </p>

<p lang="EN-US" paraeid="{3e166f19-1500-41f4-ba1a-c2c8e6d9280d}{33}" paraid="661062820"><u><strong>SAM HOUSTON vs THE AGGIES</strong></u> <br>
- Wednesday marks the fourth all-time meeting between Sam Houston and NM State, with the Aggies holding a 2-1 edge in a series in which the home team has won all three meetings <br>
 <br>
- The Kats won the last meeting in Huntsville, 31-11, in 2024 <br>
 <br>
- Three members of NM State's defensive staff were together at Sam Houston during the Kats' 10-0 spring 2021 season that culminated in the program's first FCS national championship. Defensive coordinator Joe Morris spent three seasons at Sam Houston from 2021-23, serving as defensive coordinator during his final two, while linebackers coach Jared Hensley spent eight seasons with the Kats and defensive line coach Siddiq Haynes spent seven </p>

<p lang="EN-US" paraeid="{3e166f19-1500-41f4-ba1a-c2c8e6d9280d}{40}" paraid="85370337"><u><strong>THE LAST TIME</strong></u> <br>
- NM State claimed a 37-10 victory in the teams' last meeting in 2025 in Las Cruces. The Aggies led 10-3 at halftime before Sam Houston pulled within 13-10 on the final play of the third quarter, but NM State answered with 24 unanswered points in the fourth quarter <br>
 <br>
- Naeten Mitchell capped the scoring with a 71-yard interception return for the Aggies <br>
 <br>
- NM State quarterback Logan Fife threw for 255 yards, while <dfn><a href="/sports/football/roster/hunter-watson/10076" rel="smarttag" rev="10076">Hunter Watson</a></dfn> passed for 222 yards for the Kats with Landan "Coco" Brown catching seven passes for 53 yards </p>

<p lang="EN-US" paraeid="{3e166f19-1500-41f4-ba1a-c2c8e6d9280d}{47}" paraid="685896447"><u><strong>PREGAME NOTES</strong></u> <br>
- Opposing quarterbacks have completed exactly 50 percent of their passes against Sam Houston, going 78-for-156 with seven touchdowns and five interceptions. The longest completion allowed by the Kats through six games has covered just 36 yards <br>
 <br>
- Sam Houston is one of 21 FBS teams — and one of only three in CUSA — that has not allowed a 100-yard receiver this season. Texas Tech's Kenny Johnson owns the highest receiving total against the Kats with 60 yards <br>
 <br>
- The Kats have broken up 29 passes through six games, led by <dfn><a href="/sports/football/roster/ishmel-atkins/11197" rel="smarttag" rev="11197">Ishmel Atkins</a></dfn> with five and <dfn><a href="/sports/football/roster/tyler-bailey/10012" rel="smarttag" rev="10012">Tyler Bailey</a></dfn> and <dfn><a href="/sports/football/roster/railyn-adams/10081" rel="smarttag" rev="10081">Railyn Adams</a></dfn> with four apiece <br>
 <br>
- Sam Houston has recorded 34 tackles for loss and 12 sacks through six games, its highest totals in both categories through six games since joining the FBS ranks in 2023 <br>
 <br>
- <dfn><a href="/sports/football/roster/dean-ford/10097" rel="smarttag" rev="10097">Dean Ford</a></dfn> registered a career-high 12 tackles against WKU, the first double-digit tackle performance by a Bearkat this season and the most by a Sam Houston linebacker since Kavian Gaither had 17 against Jax State in 2024. Ford has led the Kats in tackles in each of the last two games and enters Wednesday with a team-high 38 stops <br>
 <br>
- True freshman <dfn><a href="/sports/football/roster/mj-dowdy/11080" rel="smarttag" rev="11080">MJ Dowdy</a></dfn> has led Sam Houston in rushing in each of the last two games, totaling 42 yards on 11 carries at Liberty before establishing career highs with 14 carries for 55 yards against WKU. Dowdy is the first Bearkat true freshman running back to lead the team in rushing in consecutive games since Stevie Smith in 2002 <br>
 <br>
- <dfn><a href="/sports/football/roster/tim-burns-jr-/10368" rel="smarttag" rev="10368">Tim Burns Jr.</a></dfn> leads Sam Houston with 393 all-purpose yards, producing 212 as a receiver, 96 on kickoff returns and 85 on punt returns. He is the only Bearkat with yardage as a receiver, kickoff returner and punt returner this season. His 85 punt-return yards on five returns against WKU surpassed the Kats' total of 35 punt-return yards through their first five games <br>
 <br>
- <dfn><a href="/sports/football/roster/grady-o-neill/10348" rel="smarttag" rev="10348">Grady O'Neill</a></dfn> has caught 49 passes over his last nine games dating to Nov. 15, 2025, the most by a CUSA player during that span. O'Neill leads the Kats with 28 catches this season <br>
 <br>
- Sam Houston's 15 offensive touchdowns have been scored by 10 different players. Seven Bearkats have caught a touchdown pass <br>
 <br>

6,"displayOpponentHistory":7,"short_title":12,"url":12},"BVB","bvb","beach-volleyball",50,"Beach Volleyball",520,641,{"stories":368,"preloadedStories":369,"paginationCursor":370,"basePageSize":371,"isLoadingMore":372,"isLoading":373,"moreToLoad":374,"storyContent":375,"storyGames":558,"isLoadingStoryGames":115,"storyGameLeaders":559,"isLoadingStoryGameLeaders":115,"storyGamesTeamsStats":561,"isLoadingStoryGamesTeamsStats":563,"isStoryContentUnsafeHtml":564,"storyNextGame":565,"isLoadingStoryNextGame":115,"storyContentLoading":588,"nextStory":589,"storySettings":590,"defaultSportTemplate":146,"preloadedTemplates":594},{},{},{},{},{},{},{},{"3008659403757388":376},{"applyStandardFormatting":7,"blocks":12,"isBlockBased":115,"contentId":377,"contentTitle":108,"contentDate":378,"contentUrl":8,"contentImageUrl":379,"content":380,"contentTemplate":146,"id":381,"title":108,"titleInRotator":7,"subHeadline":18,"teaser":382,"type":383,"byline":18,"appExclusive":115,"date":378,"sportDisplay":178,"sport":384,"sportShortname":175,"primaryImage":387,"imageSource":379,"imageFocalPoint":12,"imageAltText":112,"imageCaption":18,"video":389,"url":8,"redirectAbsoluteUrl":18,"links":391,"homepageFeedTemplate":18,"games":392,"galleryId":344,"galleryImages":459,"writer":12,"players":460,"globalSportMapName":175,"storyMetaDescription":12,"storyMetaOgDescription":12,"storyMetaKeywords":12,"storyMetaOgTitle":12,"imageCreditText":388,"alternateImage":12,"insideContentImage":12,"formattedDate":557,"gamePostStoryId":12,"isMediaOnStoryPage":7},"14011","2026-10-20T10:00:00","\u002Fimages\u002F2026\u002F10\u002F19\u002FDSC00859.jpg","\u003Cp lang=\"EN-US\" paraeid=\"{73ff7dd1-ec47-4025-9f1c-bf16228cf482}{164}\" paraid=\"1719881657\">\u003Cstrong>Game 7 • vs NM State \u003Cbr>\r\nHuntsville • Bowers Stadium (14,500) \u003Cbr>\r\nNM State (2-4, 1-1 CUSA) at Sam Houston (1-5, 0-2 CUSA) \u003Cbr>\r\nWednesday, October 21 • 7:00 PM CT   \u003C\u002Fstrong>\u003C\u002Fp>\r\n\r\n\u003Cp lang=\"EN-US\" paraeid=\"{73ff7dd1-ec47-4025-9f1c-bf16228cf482}{199}\" paraid=\"29811262\">\u003Cstrong>TV: ESPN2\u003C\u002Fstrong> (Jorge Sedano, Rodney McLeod, Kendra Douglas) \u003Cbr>\r\n\u003Cstrong>RADIO: BSN\u003C\u002Fstrong> (Jason Barfield, Brian Adams); \u003Cstrong>KSHU 90.5 FM  \u003C\u002Fstrong> \u003C\u002Fp>\r\n\r\n\u003Cp lang=\"EN-US\" paraeid=\"{73ff7dd1-ec47-4025-9f1c-bf16228cf482}{220}\" paraid=\"493963652\">\u003Cstrong>HOW TO FOLLOW: \u003Ca href=\"https:\u002F\u002Fstats.statbroadcast.com\u002Fbroadcast\u002F?id=673114\" rel=\"noreferrer noopener\" target=\"_blank\">Live Stats\u003C\u002Fa> • @BearkatsFB on X \u003Cbr>\r\nGAME NOTES: \u003Ca href=\"https:\u002F\u002Fgobearkats.com\u002Fdocuments\u002F2026\u002F10\u002F20\u002FGame_7_vs_NMSU.pdf\" rel=\"noreferrer noopener\" target=\"_blank\">Sam Houston\u003C\u002Fa> • \u003Ca href=\"https:\u002F\u002Fgobearkats.com\u002Fdocuments\u002F2026\u002F10\u002F20\u002FGN7_-_at_Sam_Houston_-_FINAL.pdf\" rel=\"noreferrer noopener\" target=\"_blank\">NM State\u003C\u002Fa> \u003Cbr>\r\nSeries vs the Aggies: NMSU leads 2-1   \u003C\u002Fstrong>\u003C\u002Fp>\r\n\r\n\u003Cp lang=\"EN-US\" paraeid=\"{3e166f19-1500-41f4-ba1a-c2c8e6d9280d}{5}\" paraid=\"441677526\">\u003Cstrong>HUNTSVILLE –\u003C\u002Fstrong> Sam Houston looks to get into the win column in CUSA play on Wednesday night when it hosts NM State at Bowers Stadium. \u003C\u002Fp>\r\n\r\n\u003Cp lang=\"EN-US\" paraeid=\"{3e166f19-1500-41f4-ba1a-c2c8e6d9280d}{12}\" paraid=\"1929240047\">Kickoff for Wednesday's game is set for 7:00 p.m. CT and will air on ESPN2. Jorge Sedano and Rodney McLeod will have the call from Bowers Stadium with Kendra Douglas reporting from the sidelines. \u003C\u002Fp>\r\n\r\n\u003Cp lang=\"EN-US\" paraeid=\"{3e166f19-1500-41f4-ba1a-c2c8e6d9280d}{19}\" paraid=\"1431270465\">The game can also be heard on the Bearkat Sports Network with Jason Barfield and Brian Adams on the call. The BSN broadcast can be heard online on GoBearkats.com, the Bearkat Sports app and locally on KSHU 90.5 FM. \u003C\u002Fp>\r\n\r\n\u003Cp lang=\"EN-US\" paraeid=\"{3e166f19-1500-41f4-ba1a-c2c8e6d9280d}{26}\" paraid=\"1070579775\">\u003Cu>\u003Cstrong>KATS CHASE FIRST CUSA WIN AGAINST NM STATE\u003C\u002Fstrong>\u003C\u002Fu> \u003Cbr>\r\n- Wednesday's matchup features one of the nation's top passing defenses against an NM State offense averaging 230.5 yards through the air. Sam Houston has held five of its first six opponents below 200 passing yards and leads CUSA while ranking fourth nationally with 137.8 passing yards allowed per game \u003Cbr>\r\n \u003Cbr>\r\n- Sam Houston ranks second nationally in year-to-year improvement in total defense, allowing 145.3 fewer yards per game than in 2025. The Kats have limited opponents to 338.2 yards per game after surrendering 483.5 last season \u003Cbr>\r\n \u003Cbr>\r\n- The Kats held WKU to 276 yards of total offense last week, the fewest allowed by Sam Houston against an FBS opponent since limiting FIU to 199 yards in a 10-7 victory in 2024. The Hilltoppers averaged just 3.7 yards per play and were held out of the end zone for the game's final three quarters \u003Cbr>\r\n \u003Cbr>\r\n- \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Flandyn-locke\u002F10283\" rel=\"smarttag\" rev=\"10283\">Landyn Locke's\u003C\u002Fa>\u003C\u002Fdfn> 11 touchdown passes have averaged 34.5 yards, the second-highest average among FBS quarterbacks with at least 10 TD tosses this season. Locke's six touchdown passes of at least 30 yards are tied for sixth nationally and double the Kats' team total from the entire 2025 season \u003Cbr>\r\n \u003Cbr>\r\n- Locke is the only CUSA quarterback ranked among the league's top two in both passing yards per game (236.3, second) and touchdown passes (11, tied second) \u003Cbr>\r\n \u003Cbr>\r\n- True freshmen \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Fmyles-joseph\u002F12072\" rel=\"smarttag\" rev=\"12072\">Myles Joseph\u003C\u002Fa>\u003C\u002Fdfn> and \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Ftr-e-williams\u002F10899\" rel=\"smarttag\" rev=\"10899\">Tr'e Williams\u003C\u002Fa>\u003C\u002Fdfn> have started alongside one another on the offensive line in each of the last two games. According to Stats Perform, Sam Houston is the only FBS team to start two true freshmen on the offensive line in the same game this season \u003C\u002Fp>\r\n\r\n\u003Cp lang=\"EN-US\" paraeid=\"{3e166f19-1500-41f4-ba1a-c2c8e6d9280d}{33}\" paraid=\"661062820\">\u003Cu>\u003Cstrong>SAM HOUSTON vs THE AGGIES\u003C\u002Fstrong>\u003C\u002Fu> \u003Cbr>\r\n- Wednesday marks the fourth all-time meeting between Sam Houston and NM State, with the Aggies holding a 2-1 edge in a series in which the home team has won all three meetings \u003Cbr>\r\n \u003Cbr>\r\n- The Kats won the last meeting in Huntsville, 31-11, in 2024 \u003Cbr>\r\n \u003Cbr>\r\n- Three members of NM State's defensive staff were together at Sam Houston during the Kats' 10-0 spring 2021 season that culminated in the program's first FCS national championship. Defensive coordinator Joe Morris spent three seasons at Sam Houston from 2021-23, serving as defensive coordinator during his final two, while linebackers coach Jared Hensley spent eight seasons with the Kats and defensive line coach Siddiq Haynes spent seven \u003C\u002Fp>\r\n\r\n\u003Cp lang=\"EN-US\" paraeid=\"{3e166f19-1500-41f4-ba1a-c2c8e6d9280d}{40}\" paraid=\"85370337\">\u003Cu>\u003Cstrong>THE LAST TIME\u003C\u002Fstrong>\u003C\u002Fu> \u003Cbr>\r\n- NM State claimed a 37-10 victory in the teams' last meeting in 2025 in Las Cruces. The Aggies led 10-3 at halftime before Sam Houston pulled within 13-10 on the final play of the third quarter, but NM State answered with 24 unanswered points in the fourth quarter \u003Cbr>\r\n \u003Cbr>\r\n- Naeten Mitchell capped the scoring with a 71-yard interception return for the Aggies \u003Cbr>\r\n \u003Cbr>\r\n- NM State quarterback Logan Fife threw for 255 yards, while \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Fhunter-watson\u002F10076\" rel=\"smarttag\" rev=\"10076\">Hunter Watson\u003C\u002Fa>\u003C\u002Fdfn> passed for 222 yards for the Kats with Landan \"Coco\" Brown catching seven passes for 53 yards \u003C\u002Fp>\r\n\r\n\u003Cp lang=\"EN-US\" paraeid=\"{3e166f19-1500-41f4-ba1a-c2c8e6d9280d}{47}\" paraid=\"685896447\">\u003Cu>\u003Cstrong>PREGAME NOTES\u003C\u002Fstrong>\u003C\u002Fu> \u003Cbr>\r\n- Opposing quarterbacks have completed exactly 50 percent of their passes against Sam Houston, going 78-for-156 with seven touchdowns and five interceptions. The longest completion allowed by the Kats through six games has covered just 36 yards \u003Cbr>\r\n \u003Cbr>\r\n- Sam Houston is one of 21 FBS teams — and one of only three in CUSA — that has not allowed a 100-yard receiver this season. Texas Tech's Kenny Johnson owns the highest receiving total against the Kats with 60 yards \u003Cbr>\r\n \u003Cbr>\r\n- The Kats have broken up 29 passes through six games, led by \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Fishmel-atkins\u002F11197\" rel=\"smarttag\" rev=\"11197\">Ishmel Atkins\u003C\u002Fa>\u003C\u002Fdfn> with five and \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Ftyler-bailey\u002F10012\" rel=\"smarttag\" rev=\"10012\">Tyler Bailey\u003C\u002Fa>\u003C\u002Fdfn> and \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Frailyn-adams\u002F10081\" rel=\"smarttag\" rev=\"10081\">Railyn Adams\u003C\u002Fa>\u003C\u002Fdfn> with four apiece \u003Cbr>\r\n \u003Cbr>\r\n- Sam Houston has recorded 34 tackles for loss and 12 sacks through six games, its highest totals in both categories through six games since joining the FBS ranks in 2023 \u003Cbr>\r\n \u003Cbr>\r\n- \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Fdean-ford\u002F10097\" rel=\"smarttag\" rev=\"10097\">Dean Ford\u003C\u002Fa>\u003C\u002Fdfn> registered a career-high 12 tackles against WKU, the first double-digit tackle performance by a Bearkat this season and the most by a Sam Houston linebacker since Kavian Gaither had 17 against Jax State in 2024. Ford has led the Kats in tackles in each of the last two games and enters Wednesday with a team-high 38 stops \u003Cbr>\r\n \u003Cbr>\r\n- True freshman \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Fmj-dowdy\u002F11080\" rel=\"smarttag\" rev=\"11080\">MJ Dowdy\u003C\u002Fa>\u003C\u002Fdfn> has led Sam Houston in rushing in each of the last two games, totaling 42 yards on 11 carries at Liberty before establishing career highs with 14 carries for 55 yards against WKU. Dowdy is the first Bearkat true freshman running back to lead the team in rushing in consecutive games since Stevie Smith in 2002 \u003Cbr>\r\n \u003Cbr>\r\n- \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Ftim-burns-jr-\u002F10368\" rel=\"smarttag\" rev=\"10368\">Tim Burns Jr.\u003C\u002Fa>\u003C\u002Fdfn> leads Sam Houston with 393 all-purpose yards, producing 212 as a receiver, 96 on kickoff returns and 85 on punt returns. He is the only Bearkat with yardage as a receiver, kickoff returner and punt returner this season. His 85 punt-return yards on five returns against WKU surpassed the Kats' total of 35 punt-return yards through their first five games \u003Cbr>\r\n \u003Cbr>\r\n- \u003Cdfn>\u003Ca href=\"\u002Fsports\u002Ffootball\u002Froster\u002Fgrady-o-neill\u002F10348\" rel=\"smarttag\" rev=\"10348\">Grady O'Neill\u003C\u002Fa>\u003C\u002Fdfn> has caught 49 passes over his last nine games dating to Nov. 15, 2025, the most by a CUSA player during that span. O'Neill leads the Kats with 28 catches this season \u003Cbr>\r\n \u003Cbr>\r\n- Sam Houston's 15 offensive touchdowns have been scored by 10 different players. Seven Bearkats have caught a touchdown pass \u003Cbr>\r\n \u003Cbr>\r\n- The Kats rank fourth in CUSA in third-down defense, holding opponents to 27 conversions on 84 attempts for a 32.1-percent success rate \u003C\u002Fp>\r\n",14011,"\u003Cp lang=\"EN-US\" paraeid=\"{73ff7dd1-ec47-4025-9f1c-bf16228cf482}{164}\" paraid=\"1719881657\">\u003Cstrong>Game 7 • vs NM State \u003C\u002Fstrong>","pregame",{"id":176,"title":178,"abbreviation":172,"shortTitle":172,"shortname":175,"facebook":173,"twitter":179,"gender":163,"pinterest":18,"instagram":177,"youtube":18,"globalSportShortname":175,"globalSportNameSlug":175,"tickets":18,"youtubePlaylistId":385,"globalSportId":174,"nonSport":115,"showAtVs":7,"gameSynonym":386},"PLbZfp3rBKI50k3CZojq9cyNRtNMbgULF8","Games",{"caption":18,"creditText":388,"focalPoint":12,"url":379,"absoluteUrl":379,"altText":112,"title":12,"creditName":12},"Zach Warnell",{"youtube":12,"archive":12,"metadata":390},{"title":12,"thumbnail":12},[],[393],{"gameImageUrl":394,"time":395,"conference":7,"gameCenterEnabled":7,"conferenceTitle":119,"conferenceAbbrev":396,"conferenceLogo":397,"location":398,"locationIndicator":399,"neutralHometeam":12,"atVs":400,"status":401,"noplayText":18,"type":402,"gameTeamPrefix":12,"gamePromotionText":403,"gamePromotionLink":18,"gameLinks":404,"promotionImageCaption":12,"promotionImageLink":405,"promotionImagePath":406,"isADoubleheader":115,"displayVsatIndicator":7,"displayHeadToHead":7,"gameProgram":407,"gameProgramLink":12,"opponent":408,"opponents":12,"homeTeamOrderNumber":12,"eventName":12,"eventLogo":12,"media":421,"result":12,"facility":445,"tournament":12,"galleries":448,"previewStoryId":381,"postStoryId":12,"hasWePlayedMoments":115,"ticketLink":449,"gameScheduleInclude":115,"gameCalendarExclude":115,"allDay":115,"tbd":115,"isSpotlight":115,"dateUtc":454,"endDateUtc":12,"appMedia":12,"id":455,"gameState":164,"gameStateDisplay":456,"date":457,"enddate":12,"sport":458},"https:\u002F\u002Fgobearkats.com\u002Fimages\u002F2024\u002F6\u002F4\u002FLL_Football.jpg","7:00 PM","CUSA","\u002Fimages\u002F2025\u002F12\u002F16\u002FS
